<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ANP Accounts">
<meta name="theme-color" content="#fbf3e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1812" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<title>ANP Accounts</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1c1e1b; --muted:#6f7169; --line:#e6e1d6; --grid:#ece8de;
  --accent:#1f5a40; --accent-soft:#e3efe8; --amber:#a86a00; --amber-soft:#fbefd6;
  --red:#b3261e; --red-soft:#fbe3e0; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --on-accent:#fff; --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141614; --card:#1e211e; --ink:#eef0eb; --muted:#9a9e95; --line:#2d312c; --grid:#272b26;
    --accent:#6fcf9f; --accent-soft:#1f3529; --amber:#f0b44c; --amber-soft:#3a2f17;
    --red:#ff8a80; --red-soft:#3d1f1c; --shadow:none; --on-accent:#0e1a13; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto}
body.wide .wrap{max-width:1180px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 0 8px}
header .wrap{padding:0 16px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
.sync{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:999px;letter-spacing:0}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--line)}
.monthnav button{width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--accent)}
.monthnav span{font-weight:600;font-size:15px;min-width:86px;text-align:center}
.search{margin-top:10px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus{border-color:var(--accent)}

main{padding:4px 16px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.stat b{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.wide b{font-size:26px}
.stat.warn b{color:var(--amber)}
.stat .x{font-size:12px;color:var(--muted);margin-top:2px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.dhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13.5px;color:var(--muted);font-weight:600}
.dhead b{color:var(--ink);font-variant-numeric:tabular-nums}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card:active{transform:scale(.99)}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .r{text-align:right;flex:none}
.card .amt{font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;margin-top:4px;white-space:nowrap}
.b-paid{background:var(--accent-soft);color:var(--accent)}
.b-credit{background:var(--amber-soft);color:var(--amber)}
.b-over{background:var(--red-soft);color:var(--red)}
.b-mute{background:var(--grid);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty .big{font-size:40px;margin-bottom:8px}
.section-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:22px 4px 8px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--safe-b))}
nav .wrap{display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.dot{position:absolute;left:50%;margin-left:6px;top:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(80px + var(--safe-b));z-index:7;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:32px;line-height:58px;box-shadow:0 6px 18px rgba(31,90,64,.35)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:17px;margin:0;font-weight:700}
.sh-head button{color:var(--accent);font-weight:600;padding:4px 2px;font-size:16px}
.sh-head .save{font-weight:750}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(28px + var(--safe-b))}

.fgroup{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.fgroup h3{margin:0 0 8px;font-size:15px}
.flabel{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--accent)}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date].field{min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.irow{border-top:1px dashed var(--line);padding:10px 0}
.irow:first-of-type{border-top:0;padding-top:2px}
.igrid{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.3fr 32px;gap:6px;margin-top:6px;align-items:end}
.igrid label span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:0 0 2px 2px}
.igrid .field{padding:9px 8px}
.i-del{width:32px;height:40px;border-radius:10px;color:var(--red);font-size:22px}
.addi{width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;margin-top:4px}
.totalbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:18px}
.totalbar b{font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.cr{color:var(--amber)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.modes .chip{padding:8px 14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.pbtn{padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pdel{color:var(--red);font-weight:600;padding:10px 4px}

.dt-top{text-align:center;padding:6px 0 14px}
.dt-top .amt{font-size:34px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dt-top .sub{color:var(--muted);font-size:14px}
table.items{width:100%;border-collapse:collapse;font-size:14.5px}
table.items td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.items tr:last-child td{border-bottom:0}
table.items .n{font-weight:600}
table.items .q{color:var(--muted);font-size:13px}
table.items .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right;font-weight:550;word-break:break-all}
.bigphoto{width:100%;border-radius:12px;display:block}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-weight:650;font-size:16px;margin-top:10px;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--accent)}
.btn.dan{color:var(--red)}
.btn.amber{background:var(--amber);color:#fff}
.btn:disabled{opacity:.5}
.sbtn{padding:7px 12px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--accent);color:var(--on-accent)}
.sbtn.ghost{background:var(--grid);color:var(--ink)}
.sbtn.red{background:var(--red-soft);color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.more p{color:var(--muted);font-size:14px;margin:6px 0}
.more ol{padding-left:20px;margin:6px 0;font-size:14.5px}
.trow{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left}
.trow .main{flex:1;min-width:0}
.trow .t{font-weight:600;font-size:16px;word-break:break-word}
.trow .s{font-size:13px;color:var(--muted);margin-top:2px}
.trow.done .t{text-decoration:line-through;color:var(--muted)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;color:transparent;font-size:17px;font-weight:800}
.trow.done .tick{background:var(--accent);color:var(--on-accent)}
.trow .old{color:var(--red);font-weight:600}
.trow .tr,.tsheet .tr{font-size:15px;color:var(--accent);margin-top:2px;font-weight:550}
.trow.done .tr{color:var(--muted);text-decoration:line-through}
.tr a{color:var(--accent)}
.langs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;align-items:center;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.langs small{color:var(--muted);font-weight:600;flex:none}
.langs .chip{padding:5px 11px;font-size:13.5px}
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:6px 0 12px;box-shadow:var(--shadow)}
.daynav button{width:38px;height:38px;border-radius:50%;font-size:22px;color:var(--accent)}
.daynav span{font-weight:650}
.urow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .main{flex:1;min-width:0}
.urow .t{font-weight:600}
.urow .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .acts{display:flex;gap:6px;flex:none}

/* auth */
.auth{max-width:400px;margin:0 auto;padding:calc(40px + var(--safe-t)) 20px 40px}
.auth .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
.auth h1{justify-content:center;font-size:26px}
.auth .tag{text-align:center;color:var(--muted);margin:4px 0 22px}
.auth .field{margin-bottom:10px;background:var(--card)}
.auth .link{display:block;margin:14px auto 0;color:var(--accent);font-weight:600;font-size:15px}
.auth .err{color:var(--red);font-size:14px;margin:4px 0 8px;min-height:1em}
.auth .msg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted)}
.auth .msg b{color:var(--ink)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--grid);padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-all;color:var(--ink)}

/* dashboard */
.dfilters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:6px 0 12px;box-shadow:var(--shadow)}
.dfilters .chips{margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid label span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin:0 0 3px 2px}
.fgrid .field{padding:9px 10px;font-size:15px}
.dash-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 2px;font-size:15px}
.panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.ptitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chartbox{position:relative;width:100%;height:220px}
.chartbox svg{display:block;width:100%;height:100%}
.chartbox text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:2;line-height:1.45}
.tip b{font-size:14px}
.blist .bi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0}
.blist .bi .l{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist .bi .v{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.blist .bi .bar{grid-column:1/-1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.blist .bi .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.blist .bi .m{grid-column:1/-1;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
.tscroll{overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;max-height:460px}
table.dt thead th{position:sticky;top:0;background:var(--card);z-index:1}
table.dt tfoot td{position:sticky;bottom:0;background:var(--card)}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.dt th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr:last-child td{border-bottom:0}
table.dt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:var(--bg)}
table.dt tfoot td{font-weight:700;border-top:2px solid var(--line)}
table.dt .clip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xlbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:14.5px;white-space:nowrap}
@media (min-width:900px){
  .dash-stats{grid-template-columns:repeat(5,1fr)}
  .fgrid{grid-template-columns:repeat(6,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .chartbox{height:260px}
}

header h1{font-size:clamp(21px,6.4vw,28px);white-space:nowrap;min-width:0;overflow:hidden}
#title{overflow:hidden;text-overflow:ellipsis}
.backbtn{font-size:34px;line-height:1;color:var(--accent);margin:-4px 2px 0 -6px;padding:0 6px}
.books{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.bookbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow)}
.bookbtn:active{transform:scale(.99)}
.bookbtn.small{margin-top:12px;padding:12px 16px}
.bicon{font-size:38px;width:58px;height:58px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.bookbtn.small .bicon{font-size:24px;width:42px;height:42px}
.bmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bname{font-size:21px;font-weight:750;letter-spacing:-.01em}
.bsub{font-size:14px;color:var(--muted)}
.bsub b{color:var(--ink)}
.bbadges{display:flex;gap:6px;flex-wrap:wrap}
.chev{font-size:28px;color:var(--muted);flex:none}
.card .line{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.card .line .q{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.stats.three{grid-template-columns:1fr 1fr 1fr}
.chip.big{padding:10px 18px;font-size:15.5px}
.igrid3{display:grid;grid-template-columns:1.6fr 1fr 1fr 32px;gap:6px;align-items:end}
.igrid3 label span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:0 0 2px 2px}
.igrid3 .field{padding:9px 8px}
.irow.iron .hint{margin:4px 2px 0}
.rrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
.rrow.rhead span{font-size:11.5px;color:var(--muted);font-weight:650}
.rrow .field{padding:9px 8px}
table.nb{min-width:0}
table.nb td,table.nb th{padding:8px 6px}
.nbpanel .ptitle{align-items:center;margin-bottom:6px}

<script type="module">
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INR = new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:0, maximumFractionDigits:2});
const INR2 = new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:2, maximumFractionDigits:2});
const money = n => { const v = Math.round((+n || 0) * 100) / 100; return (Number.isInteger(v) ? INR : INR2).format(v); };
const moneyShort = n => { n = +n || 0; const a = Math.abs(n);
  if (a >= 1e7) return '₹' + +(n/1e7).toFixed(1) + 'Cr';
  if (a >= 1e5) return '₹' + +(n/1e5).toFixed(1) + 'L';
  if (a >= 1e3) return '₹' + +(n/1e3).toFixed(1) + 'k';
  return '₹' + Math.round(n); };
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const prettyDate = s => parse(s).toLocaleDateString(LOC(), {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const shortDate = s => parse(s).toLocaleDateString(LOC(), {day:'numeric', month:'short'});
const monthLabel = m => parse(m + '-01').toLocaleDateString(LOC(), {month:'short', year:'numeric'});
const monthStart = (s, back = 0) => { const d = parse(s); d.setDate(1); d.setMonth(d.getMonth() - back); return ds(d); };
const monthEnd = s => { const d = parse(s); d.setMonth(d.getMonth() + 1, 0); return ds(d); };
const total = e => r2((e.items || []).reduce((t, i) => t + num(i.amount), 0));
const sum = (arr, f) => r2(arr.reduce((t, x) => t + f(x), 0));
const isPending = e => e.status === 'credit' && !e.paidOn;
const MODES = ['Cash', 'UPI', 'Card', 'Bank transfer', 'Cheque', 'Other'];
const UNITS = ['pcs', 'kg', 'g', 'L', 'ml', 'pack', 'dozen', 'box', 'bag', 'm'];
const PRESS = 'Pressing';
const isPress = i => String(i?.name || '').trim().toLowerCase() === 'pressing';
const pressRate = () => num(S.settings?.pressRate);
const CFG = window.GHAR_CONFIG || {};
const ADMIN = String(CFG.adminEmail || '').trim().toLowerCase();

function toast(msg) {
  const t = $('#toast'); t.textContent = typeof tx === 'function' ? tx(msg) : msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const errText = e => {
  const c = e?.code || '';
  return ({'auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'No account with that email',
    'auth/email-already-in-use':'An account with this email already exists — sign in instead','auth/weak-password':'Password must be at least 6 characters',
    'auth/invalid-email':'That email looks wrong','auth/too-many-requests':'Too many tries. Wait a minute and try again',
    'auth/network-request-failed':'No internet connection','permission-denied':'You don\'t have access to do that'})[c] || e?.message || String(e);
};

/* ================= data layer: Firebase ================= */
async function firebaseAPI(cfg) {
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch { db = F.getFirestore(app); }
  const clean = o => JSON.parse(JSON.stringify(o));
  const U = u => u && {uid: u.uid, email: u.email, emailVerified: u.emailVerified, name: u.displayName};
  const list = s => s.docs.map(d => ({...d.data(), id: d.id, _pending: d.metadata.hasPendingWrites}));
  const col = n => F.collection(db, n);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(U(u))),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: async (n, e, p) => { const c = await A.createUserWithEmailAndPassword(auth, e, p); await A.updateProfile(c.user, {displayName: n}); return U(c.user); },
    reset: e => A.sendPasswordResetEmail(auth, e),
    signOut: () => A.signOut(auth),
    sendVerify: () => A.sendEmailVerification(auth.currentUser),
    refresh: async () => { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); return U(auth.currentUser); },
    watchMe: (uid, cb, err) => F.onSnapshot(F.doc(db, 'users', uid), s => cb(s.exists() ? s.data() : null), err),
    createMe: (uid, d) => F.setDoc(F.doc(db, 'users', uid), d),
    watchUsers: (cb, err) => F.onSnapshot(col('users'), s => cb(s.docs.map(d => ({uid: d.id, ...d.data()}))), err),
    updateUser: (uid, p) => F.updateDoc(F.doc(db, 'users', uid), p),
    watchEntries: (since, cb, err) => F.onSnapshot(F.query(col('entries'), F.where('date', '>=', since)), {includeMetadataChanges: true}, s => cb(list(s)), err),
    watchCredits: (cb, err) => F.onSnapshot(F.query(col('entries'), F.where('status', '==', 'credit')), {includeMetadataChanges: true}, s => cb(list(s)), err),
    watchBook: (book, cb, err) => F.onSnapshot(F.query(col('entries'), F.where('book', '==', book)), {includeMetadataChanges: true}, s => cb(list(s)), err),
    fetchRange: async (from, to) => list(await F.getDocs(F.query(col('entries'), F.where('date', '>=', from), F.where('date', '<=', to)))),
    newId: () => F.doc(col('entries')).id,
    saveEntry: e => F.setDoc(F.doc(db, 'entries', e.id), clean(e)),
    deleteEntry: id => F.deleteDoc(F.doc(db, 'entries', id)),
    savePhoto: (id, data) => F.setDoc(F.doc(db, 'photos', id), {data}),
    getPhoto: async id => { const s = await F.getDoc(F.doc(db, 'photos', id)); return s.exists() ? s.data().data : null; },
    deletePhoto: id => F.deleteDoc(F.doc(db, 'photos', id)),
    watchTasks: (since, cb, err) => F.onSnapshot(F.query(col('tasks'), F.where('date', '>=', since)), {includeMetadataChanges: true}, s => cb(list(s)), err),
    watchOpenTasks: (cb, err) => F.onSnapshot(F.query(col('tasks'), F.where('done', '==', false)), {includeMetadataChanges: true}, s => cb(list(s)), err),
    newTaskId: () => F.doc(col('tasks')).id,
    saveTask: t => F.setDoc(F.doc(db, 'tasks', t.id), clean(t)),
    deleteTask: id => F.deleteDoc(F.doc(db, 'tasks', id)),
    watchSettings: (cb, err) => F.onSnapshot(F.doc(db, 'settings', 'app'), s => cb(s.exists() ? s.data() : {}), err),
    watchPresence: (cb, err) => F.onSnapshot(col('presence'), s => cb(s.docs.map(d => ({uid: d.id, ...d.data()}))), err),
    setPresence: (uid, d) => F.setDoc(F.doc(db, 'presence', uid), d, {merge: true}),
    saveSettings: p => F.setDoc(F.doc(db, 'settings', 'app'), p, {merge: true}),
  };
}

  const watch = (fn) => { listeners.add(fn); fn(); return () => listeners.delete(fn); };
  return {
    demo: true,
    onAuth: cb => setTimeout(() => cb(me), 50),
    signIn: async () => {}, signUp: async () => me, reset: async () => {}, signOut: async () => location.reload(),
    sendVerify: async () => {}, refresh: async () => me,
    watchMe: (uid, cb) => watch(() => cb(users[uid] || null)),
    createMe: async (uid, d) => { users[uid] = d; emit(); },
    watchUsers: cb => watch(() => cb(Object.entries(users).map(([uid, u]) => ({uid, ...u})))),
    updateUser: async (uid, p) => { Object.assign(users[uid], p); emit(); },
    watchEntries: (since, cb) => watch(() => cb(Object.values(entries).filter(e => e.date >= since).map(e => ({...e})))),
    watchCredits: cb => watch(() => cb(Object.values(entries).filter(e => e.status === 'credit').map(e => ({...e})))),
    watchBook: (book, cb) => watch(() => cb(Object.values(entries).filter(e => e.book === book).map(e => ({...e})))),
    fetchRange: async (f, t) => Object.values(entries).filter(e => e.date >= f && e.date <= t).map(e => ({...e})),
    newId: () => 'e' + (n++),
    saveEntry: async e => { entries[e.id] = JSON.parse(JSON.stringify(e)); emit(); },
    deleteEntry: async id => { delete entries[id]; emit(); },
    savePhoto: async (id, d) => { photos[id] = d; }, getPhoto: async id => photos[id] || null, deletePhoto: async id => { delete photos[id]; },
    watchSettings: cb => watch(() => cb({...settings})),
    watchPresence: cb => watch(() => cb(Object.entries(presence).map(([uid, p]) => ({uid, ...p})))),
    setPresence: async (uid, d) => { presence[uid] = {...(presence[uid] || {}), ...d}; emit(); },
    watchTasks: (since, cb) => watch(() => cb(Object.values(tasks).filter(t => t.date >= since).map(t => ({...t})))),
    watchOpenTasks: cb => watch(() => cb(Object.values(tasks).filter(t => !t.done).map(t => ({...t})))),
    newTaskId: () => 't' + (n++),
    saveTask: async t => { tasks[t.id] = JSON.parse(JSON.stringify(t)); emit(); },
    deleteTask: async id => { delete tasks[id]; emit(); },
    saveSettings: async p => { Object.assign(settings, p); emit(); },
  };
}

// translate one UI string; composite "A · B" strings are translated part by part
function tx(str) {
  if (LI < 0 || !str) return str;
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2];
  if (!core) return str;
  const one = s => {
    if (D[s]) return D[s][LI];
    for (const [re, out] of PATTERNS) { const mm = s.match(re); if (mm) return out[LI].replace(/\$(\d)/g, (_, i) => tx(mm[+i] || '')); }
    return null;
  };
  let out = D[core] ? D[core][LI] : null;
  if (out == null && core.includes(' · ')) { const parts = core.split(' · '), tr = parts.map(p => tx(p)); if (tr.some((p, i) => p !== parts[i])) out = tr.join(' · '); }
  if (out == null) out = one(core);
  if (out == null) { const em = core.match(/^(\p{Extended_Pictographic}\S*) (.+)$/u); if (em) { const r = tx(em[2]); if (r !== em[2]) out = em[1] + ' ' + r; } }
  return out == null ? str : m[1] + out + m[3];
}
function txNode(root) {
  if (LI < 0 || !root) return;
  const skip = el => !el || !el.closest || !!el.closest('[data-nt],script,style,textarea,audio');
  if (root.nodeType === 3) { if (!skip(root.parentElement)) { const v = tx(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest('[data-nt]')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) { if (skip(n.parentElement)) continue; const v = tx(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  const els = root.querySelectorAll ? [root, ...root.querySelectorAll('[placeholder],[aria-label]')] : [];
  for (const el of els) { if (!el.getAttribute || el.closest('[data-nt]')) continue;
    for (const a of ['placeholder', 'aria-label']) { const v = el.getAttribute(a); if (v) { const t = tx(v); if (t !== v) el.setAttribute(a, t); } } }
}
if (LI >= 0) {
  new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') txNode(m.target); else m.addedNodes.forEach(txNode); } })
    .observe(document.body, {childList: true, subtree: true, characterData: true});

  window.confirm = msg => _c(tx(msg)); window.prompt = (msg, d) => _p(tx(msg), d);
}

const unitFactor = u => (u === 'g' || u === 'ml') ? 0.001 : 1;          // rate is per kg / per L for g / ml
const rateUnit = u => u === 'g' ? '/kg' : u === 'ml' ? '/L' : '';
const lineAmt = (qty, rate, unit) => r2(num(qty) * num(rate) * unitFactor(unit));

const ironOthers = e => (e.items || []).filter(i => i.other).reduce((t, i) => t + num(i.amount), 0);

  const g = ironCounts(e), given = g.wash + g.iron, back = num(e.retWash) + num(e.retIron);

const configured = () => CFG.firebase && CFG.firebase.apiKey && !String(CFG.firebase.apiKey).startsWith('PASTE');

async function boot() {
  const demo = new URLSearchParams(location.search).has('demo');
  if (!configured() && !demo) return screenSetup();
  try { api = demo ? demoAPI() : await firebaseAPI(CFG.firebase); }
  catch (e) { return screenMsg('Could not connect', `Check your internet connection and reload.<br><small>${esc(e.message)}</small>`, true); }
  api.onAuth(onUser);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
    // when a new version installs, reload once so it shows straight away
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !S.reloaded) { S.reloaded = true; location.reload(); } });
  }
  addEventListener('online', updateSync); addEventListener('offline', updateSync);
}

function stopWatching() { S.unsub.forEach(f => { try { f(); } catch {} }); S.unsub = []; }

function onUser(user) {
  stopWatching(); closeSheet();
  S.user = user; S.me = null; S.started = false;
  if (!user) return screenLogin('in');
  S.isOwner = !!(user.email && user.email.toLowerCase() === ADMIN);
  S.isAdmin = S.isOwner;
  S.unsub.push(api.watchMe(user.uid, async doc => {
    if (!doc) {
      const d = {name: user.name || user.email.split('@')[0], email: user.email.toLowerCase(), createdAt: Date.now(),
        status: S.isOwner ? 'approved' : 'pending', role: S.isOwner ? 'admin' : 'member'};
      try { await api.createMe(user.uid, d); } catch (e) { screenMsg('Setup problem', esc(errText(e)) + '<br><br>Check that the Firestore rules were published.', true); }
      return;
    }
    S.me = doc;
    S.isAdmin = S.isOwner || doc.role === 'admin';
    if (S.isAdmin || doc.status === 'approved') { if (!S.started) startApp(); else render(); }
    else if (doc.status === 'pending') { S.started = false; screenMsg('Waiting for approval', `Hi <b>${esc(doc.name)}</b>, your account is created.<br>Ask the admin to approve you. This screen opens by itself once approved.`, true); }
    else { S.started = false; screenMsg('Access removed', 'The admin has removed your access. Contact them if this is a mistake.', true); }
  }, e => screenMsg('Setup problem', esc(errText(e)) + '<br><br>Check that the Firestore rules were published.', true)));
}

/* ---- small videos: recorded in-app at low quality, stored in ~900 KB pieces ---- */
const VCHUNK = 900000, VMAX = 8 * 1024 * 1024;
async function saveVideo(id, blob, oldChunks) {
  const clean = new Blob([blob], {type: (blob.type || 'video/mp4').split(';')[0]});   // "codecs=vp8,opus" has a comma that breaks data URLs
  const data = await blobToDataURL(clean), n = Math.ceil(data.length / VCHUNK);
  for (let i = 0; i < n; i++) await api.savePhoto(`gv_${id}_${i}`, data.slice(i * VCHUNK, (i + 1) * VCHUNK));
  for (let i = n; i < (oldChunks || 0); i++) api.deletePhoto(`gv_${id}_${i}`).catch(() => {});
  return n;
}
async function loadVideo(id, n) {
  const parts = await Promise.all([...Array(n)].map((_, i) => api.getPhoto(`gv_${id}_${i}`)));
  if (parts.some(p => !p)) return null;
  return URL.createObjectURL(await (await fetch(parts.join(''))).blob());
}
function deleteVideo(id, n) { for (let i = 0; i < (n || 0); i++) api.deletePhoto(`gv_${id}_${i}`).catch(() => {}); }
const VRec = {
  stream: null, mr: null, chunks: [], timer: null,
  supported: () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder),
  async start(previewEl, onTick, onLimit) {
    this.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 640}, height: {ideal: 480}}, audio: true});
    previewEl.srcObject = this.stream; previewEl.muted = true; previewEl.play().catch(() => {});
    const type = ['video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
    this.mr = new MediaRecorder(this.stream, {...(type ? {mimeType: type} : {}), videoBitsPerSecond: 450000, audioBitsPerSecond: 32000});
    this.chunks = []; this.mr.ondataavailable = e => e.data && e.data.size && this.chunks.push(e.data);
    this.mr.start(500); const t0 = Date.now();
    this.timer = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); onTick(s); if (s >= 60) onLimit(); }, 250);
  },
  stop() { return new Promise(res => { const mr = this.mr; if (!mr) return res(null); clearInterval(this.timer);
    mr.onstop = () => { this.stream?.getTracks().forEach(t => t.stop()); const b = new Blob(this.chunks, {type: mr.mimeType || 'video/mp4'}); this.mr = null; this.stream = null; res(b.size ? b : null); };
    mr.stop(); }); },
  cancel() { clearInterval(this.timer); try { if (this.mr) { this.mr.onstop = null; this.mr.stop(); } } catch {} this.stream?.getTracks().forEach(t => t.stop()); this.mr = null; this.stream = null; },
};
function mountVideo(el, state) {
  const draw = (mode, secs) => {
    if (mode === 'rec') el.innerHTML = `<video class="vprev" playsinline muted autoplay></video><button type="button" class="vbtn rec" data-gstop>■ Stop · ${secs || 0}s</button><span class="hint">Max 60s</span>`;
    else if (state.url) el.innerHTML = `<video class="vprev" src="${state.url}" controls playsinline></video><button type="button" class="pdel" data-gdel>Remove video</button>`;

  };

      catch { VRec.cancel(); draw(); toast('Camera not allowed. Allow it in phone settings.'); }
    }
    if (ev.target.closest('[data-gstop]')) {
      const b = await VRec.stop();
      if (b && b.size > VMAX) toast('Video too big. Keep it shorter.');
      else if (b) { state.blob = b; state.url = URL.createObjectURL(b); state.changed = true; }

    }
    if (ev.target.closest('[data-gpick]')) {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*';

        if (f.size > VMAX) return toast(tx('Video too big') + ` (${Math.round(f.size / 1048576)} MB). ` + tx('Record in the app instead (max 60s).'));
        state.blob = f; state.url = URL.createObjectURL(f); state.changed = true; draw(); };
      inp.click();
    }
    if (ev.target.closest('[data-gdel]')) { state.blob = null; state.url = null; state.changed = true; draw(); }
  };
}

function poojaICS(p) {
  const pad2 = n => String(n).padStart(2, '0');
  const [y, m, d] = p.date.split('-');
  const st = (p.start || '09:00').split(':'), en = (p.end || '').split(':');
  const utc = (hh, mm) => new Date(`${y}-${m}-${d}T${pad2(hh)}:${pad2(mm)}:00+05:30`).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const startU = utc(st[0], st[1]);
  let endU = p.end ? utc(en[0], en[1]) : new Date(new Date(`${y}-${m}-${d}T${pad2(st[0])}:${pad2(st[1])}:00+05:30`).getTime() + 36e5).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  if (endU <= startU) endU = new Date(new Date(`${y}-${m}-${d}T${pad2(st[0])}:${pad2(st[1])}:00+05:30`).getTime() + 36e5).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const items = (p.checklist || []).map(i => i.name + (i.qty ? ' (' + i.qty + ')' : '')).join(', ');
  const escI = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ANP Accounts//Pooja//EN', 'BEGIN:VEVENT', `UID:${p.id}@anp-accounts`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART:${startU}`, `DTEND:${endU}`, `SUMMARY:🪔 ${escI(p.name)}`,
    `DESCRIPTION:${escI((p.note ? p.note + '\n' : '') + (items ? 'Samagri: ' + items : ''))}`,
    'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', `DESCRIPTION:Tomorrow: ${escI(p.name)}`, 'END:VALARM',
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', `DESCRIPTION:${escI(p.name)} in 1 hour`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type: 'text/calendar'}), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = (p.name || 'pooja').replace(/[^\w]+/g, '-') + '.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast('Opening calendar… tap Add to save the reminder');
}
function poojaReminder() {
  const n = nextPooja(); if (!n) return;
  const d = daysBetween(today(), n.date); if (d > 1) return;
  const key = 'pjRem_' + n.id + '_' + today(); try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch {}
  const [r, c] = poojaReady(n), msg = `🪔 ${n.name} ${d === 0 ? 'today' : 'tomorrow'}${n.start ? ' at ' + fmtTime(n.start) : ''}${c ? ` · ${r}/${c} ready` : ''}`;
  setTimeout(() => { toast(msg); notify('ANP Accounts', msg); }, 1500);
}

function saveForm() {
  const e = S.editing, iron = bookOf(e) === 'iron';
  let items;
  if (iron) {
    items = readIronItems();
    if (!items.length) return toast('Enter how many clothes');
  } else {
    items = [...document.querySelectorAll('#items .irow')].map(r => {
      const qty = num(r.querySelector('.i-qty').value);
      let rate = num(r.querySelector('.i-rate').value), amount = num(r.querySelector('.i-amt').value);
      const unit = r.querySelector('.i-unit').value;
      if (!amount && rate) amount = lineAmt(qty, rate, unit);
      if (!rate && amount && qty) rate = r2(amount / (qty * unitFactor(unit)));
      return {name: r.querySelector('.i-name').value.trim(), qty, unit, rate, amount};
    }).filter(i => i.name || i.amount);
    if (!items.length) return toast('Add at least one item');
    if (items.some(i => !i.name)) return toast('An item is missing its name');
  }
  e.date = $('#fDate').value || today(); e.items = items; e.notes = $('#fNotes').value.trim(); e.vendor = BOOKS[bookOf(e)].name;
  if (e.status === 'paid') { e.ref = e.mode === 'Cash' ? '' : $('#fRef').value.trim(); e.dueDate = null; e.paidOn = null; e.paidMode = null; e.paidRef = null; e.paidByName = null; }
  else { e.dueDate = $('#fDue').value || addDays(e.date, 30); e.ref = ''; e.mode = null; }

  e.updatedAt = Date.now(); e.updatedByName = S.me.name;

    (S.photo.data ? api.savePhoto(e.id, S.photo.data) : api.deletePhoto(e.id)).catch(err => toast('Photo: ' + errText(err)));
  }
  api.saveEntry(e).catch(err => toast('Not saved: ' + errText(err)));
  S.month = e.date.slice(0, 7); ensureMonth();
  closeSheet(); toast(isNew ? `Saved · ${money(total(e))}` : 'Updated');
}

/* ================= photos ================= */
function toJpeg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that photo')); i.src = src; }); }
async function fitPhoto(img) { // Firestore docs max 1 MB; keep photos ~<600 KB
  let max = 1200, q = 0.65, out = toJpeg(img, max, q);
  while (out.length > 600000 && max > 500) { max -= 200; q -= 0.05; out = toJpeg(img, max, q); }
  return out;
}
let photoCb = null;
function pickPhoto(camera, cb) { photoCb = cb; (camera ? $('#taskPhotoInput') : $('#photoInput')).click(); }
async function onPicked(ev) {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f || !photoCb) return;
  const url = URL.createObjectURL(f);
  try { photoCb(await fitPhoto(await loadImg(url))); } catch (err) { toast(err.message); }
  URL.revokeObjectURL(url);
}
$('#photoInput').onchange = onPicked; $('#taskPhotoInput').onchange = onPicked;

/* ================= voice notes ================= */
const VLANGS = [['hi-IN', 'हिन्दी / Hinglish'], ['gu-IN', 'ગુજરાતી'], ['en-IN', 'English']];
const vLang = () => { try { return localStorage.getItem('vLang') || 'hi-IN'; } catch { return 'hi-IN'; } };
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const Rec = {
  mr: null, stream: null, sr: null, chunks: [], t0: 0, timer: null,
  supported: () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder),
  async start(onTick, onText) {

/* ================= translation (Google Translate, no key) ================= */
const LANGS = [['', 'Original'], ['en', 'English'], ['gu', 'ગુજરાતી'], ['hi', 'हिन्दी']];
const TR = (() => { try { return JSON.parse(localStorage.getItem('trCache') || '{}'); } catch { return {}; } })();
const trKey = (tl, txt) => tl + '|' + txt;
let trSaveT;
function trLang() { return APPLANG === 'gu' ? 'gu' : APPLANG === 'hn' ? '' : 'en'; }
function trLink(tl, txt) { return `https://translate.google.com/?sl=auto&tl=${tl}&text=${encodeURIComponent(txt)}&op=translate`; }
const trPending = new Set();
async function translate(tl, txt) {
  const k = trKey(tl, txt);
  if (k in TR || trPending.has(k)) return TR[k];
  trPending.add(k);
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    TR[k] = {t: (d[0] || []).map(x => x[0]).join('').trim(), src: d[2] || ''};
  } catch { TR[k] = {err: true}; }
  trPending.delete(k);
  clearTimeout(trSaveT); trSaveT = setTimeout(() => { try { const ks = Object.keys(TR); if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(x => delete TR[x]); localStorage.setItem('trCache', JSON.stringify(TR)); } catch {} }, 500);
  return TR[k];
}
function trLine(txt) {
  const tl = trLang(); if (!tl || !txt) return '';
  const c = TR[trKey(tl, txt)];
  if (!c) { const k = trKey(tl, txt); if (!trPending.has(k)) translate(tl, txt).then(() => { clearTimeout(trLine._t); trLine._t = setTimeout(() => S.view === 'tasks' && render(), 60); }); return `<div class="tr">…</div>`; }
  if (c.err) return `<div class="tr"><a href="${trLink(tl, txt)}" target="_blank" rel="noopener">Translate ↗</a></div>`;
  if (!c.t || c.t.toLowerCase() === txt.toLowerCase() || c.src === tl) return '';
  return `<div class="tr" data-nt>${esc(c.t)}</div>`;
}

const HOME_R = 150;
function distM(a, b) { const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function agoText(ms) { if (!ms) return ''; const m = Math.round((Date.now() - ms) / 6e4);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : shortDate(ds(new Date(ms))); }
function personState(uid) {

// in-app alerts (+ phone notification when allowed) for task changes made by others
function taskAlerts() {
  if (!S.user) return;
  const sig = t => tStatus(t) + '|' + (t.declinedAt || 0) + '|' + (t.assignedTo || '');
  let seen; try { seen = JSON.parse(localStorage.getItem('taskSeen') || 'null'); } catch { seen = null; }
  const first = !S.taskSeenInit; S.taskSeenInit = true;
  const now = {}, msgs = [];
  for (const t of S.taskList) {
    now[t.id] = sig(t);
    if (!seen || seen[t.id] === now[t.id] || t._pending) continue;
    const st = tStatus(t), by = t.updatedBy || t.createdBy;
    if (by === S.user.uid) continue;
    const newForMe = isMine(t) && openish(st) && (!(t.id in seen) || String(seen[t.id]).split('|')[2] !== (t.assignedTo || ''));
    if (newForMe && st === 'open' && !t.declinedAt) msgs.push(`${t.urgent ? '🚨 Urgent task' : 'New task'} from ${t.reassignedByName || t.createdByName}: ${t.title}`);
    else if (st === 'review' && S.isAdmin) msgs.push(`${t.submittedByName || 'Someone'} finished: ${t.title}. Please approve.`);
    else if (st === 'open' && t.declinedAt && isMine(t)) msgs.push(`Redo: ${t.title} (${t.declinedByName})`);
    else if (st === 'done' && t.submittedBy === S.user.uid) msgs.push(`Approved ✓ ${t.title}`);
  }
  try { localStorage.setItem('taskSeen', JSON.stringify(now)); } catch {}
  if (!msgs.length) return;
  if (first && msgs.length > 1) { toast(`${msgs.length} task updates since you last opened`); notify('ANP Accounts', `${msgs.length} task updates`); return; }
  msgs.slice(0, 3).forEach((m, i) => setTimeout(() => { toast(m); notify('ANP Accounts', m); }, i * 2600));
}
async function notify(title, body) {

    else new Notification(title, {body, icon: 'icon-192.png'});
  } catch {}
}

/* ================= dashboard (notebook style) ================= */
function presetRange(p) {
  const t = today();
  switch (p) {
    case 'today': return [t, t];
    case 'yday': { const y = addDays(t, -1); return [y, y]; }
    case '7d': return [addDays(t, -6), t];
    case 'month': return [monthStart(t), t];
    case 'lmonth': { const s = monthStart(t, 1); return [s, monthEnd(s)]; }
  }
  return [S.dash.from, S.dash.to];
}
async function rangeEntries() {
  const {from, to} = S.dash;
  if (from >= S.since) return S.entries.filter(e => e.date >= from && e.date <= to);
  const key = from + '|' + to;
  if (S.rangeCache?.key === key) return S.rangeCache.list;
  const list = (await api.fetchRange(from, to)).filter(e => !['things', 'guide', 'pooja'].includes(e.book));
  const m = new Map(list.map(e => [e.id, e]));
  S.entries.forEach(e => { if (e.date >= from && e.date <= to) m.set(e.id, e); });
  S.rangeCache = {key, list: [...m.values()]};
  return S.rangeCache.list;
}

/* ================= Excel export ================= */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('Excel library did not load')); document.head.appendChild(s); });
}
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    try { await navigator.share({files: [file], title: name}); return; } catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function reportRows() {
  const list = S.dashList || [], d = S.dash, sheets = {};
  const st = bookStats(list);
  sheets.Summary = [['ANP Accounts report'], ['Period', `${d.from} to ${d.to}`], [], ['Book', 'Total', 'Paid', 'To pay'],
    ...BOOK_KEYS.map(k => { const s = bookStats(list.filter(e => bookOf(e) === k)); return [BOOKS[k].name, s.t, s.paid, s.p]; }), ['TOTAL', st.t, st.paid, st.p]];
  for (const k of BOOK_KEYS) {
    const es = list.filter(e => bookOf(e) === k); if (d.book && d.book !== k) continue;
    if (k === 'iron') sheets.Iron = [['Date', 'Cloth', 'Wash', 'Iron', 'Wash rate', 'Iron rate', 'Amount', 'Entry total', 'Returned wash', 'Returned iron', 'Returned on', 'Status', 'Paid by', 'UTR', 'Added by'],
      ...es.flatMap(e => (e.items || []).map((i, n) => [e.date, i.other ? 'Others' + (i.note ? ' (' + i.note + ')' : '') : i.name, i.other ? '' : num(i.wash), i.other ? '' : num(i.iron), i.other ? '' : num(i.washRate), i.other ? '' : num(i.ironRate), num(i.amount),
        n ? '' : total(e), n ? '' : num(e.retWash), n ? '' : num(e.retIron), n ? '' : (e.retOn || ''), n ? '' : statusText(e), n ? '' : (e.status === 'paid' ? e.mode : e.paidMode || ''), n ? '' : (e.ref || e.paidRef || ''), n ? '' : (e.createdByName || '')]))];
    else sheets[BOOKS[k].name] = [['Date', 'Item', 'Qty', 'Unit', 'Rate', 'Amount', 'Entry total', 'Status', 'Paid by', 'Paid on', 'UTR', 'Added by', 'Notes'],
      ...es.flatMap(e => (e.items || []).map((i, n) => [e.date, i.name, num(i.qty), i.unit, num(i.rate), num(i.amount), n ? '' : total(e), n ? '' : statusText(e),
        n ? '' : (e.status === 'paid' ? e.mode : e.paidMode || ''), n ? '' : (e.status === 'paid' ? e.date : e.paidOn || ''), n ? '' : (e.ref || e.paidRef || ''), n ? '' : (e.createdByName || ''), n ? '' : (e.notes || '')]))];
  }
  return sheets;
}
async function exportExcel() {
  if (S.view !== 'dash') return;
  const sheets = reportRows(), name = `anp-accounts_${S.dash.from}_to_${S.dash.to}`;
  try {
    const X = await loadXLSX(), wb = X.utils.book_new();
    for (const [title, rows] of Object.entries(sheets)) {
      const ws = X.utils.aoa_to_sheet(rows);
      ws['!cols'] = title === 'Summary' ? [{wch: 22}, {wch: 24}, {wch: 14}, {wch: 14}] : rows[0].map((_, ci) => ({wch: Math.min(40, Math.max(9, ...rows.map(r => String(r[ci] ?? '').length + 2)))}));
      const range = X.utils.decode_range(ws['!ref']), head = title === 'Summary' ? rows[3] : rows[0];
      for (let R = 1; R <= range.e.r; R++) for (let C = 0; C <= range.e.c; C++) { const cell = ws[X.utils.encode_cell({r: R, c: C})]; if (cell && cell.t === 'n' && /Amount|total|Total|Paid|To pay|rate|Rate/.test(String(head[C] || ''))) cell.z = '"₹"#,##0.00'; }
      if (title !== 'Summary') ws['!autofilter'] = {ref: ws['!ref']};
      X.utils.book_append_sheet(wb, ws, title);
    }
    const out = X.write(wb, {bookType: 'xlsx', type: 'array'});
    await shareOrDownload(new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name + '.xlsx');
  } catch (err) {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = Object.entries(sheets).filter(([t]) => t !== 'Summary').flatMap(([t, r]) => [[t], ...r, []]);
    await shareOrDownload(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type: 'text/csv'}), name + '.csv');
    toast('Excel library unavailable. Saved as CSV instead');
  }
}

  const bt = t.closest('[data-back-task]'); if (bt) { Rec.cancel(); return openTask(bt.dataset.backTask); }
  const ed = t.closest('[data-edit]'); if (ed) return openForm(findEntry(ed.dataset.edit));
  const mp = t.closest('[data-markpaid]'); if (mp) return openMarkPaid(mp.dataset.markpaid);
  const rt = t.closest('[data-return]'); if (rt) return openReturn(rt.dataset.return);
  const up = t.closest('[data-unpay]');
  if (up) { const e = findEntry(up.dataset.unpay); const u = {...strip(e), paidOn: null, paidMode: null, paidRef: null, paidByName: null, updatedAt: Date.now(), updatedByName: S.me.name};
    api.saveEntry(u).catch(err => toast(errText(err))); Object.assign(e, u); return openDetail(e.id); }
  const dl = t.closest('[data-delete]');
  if (dl && confirm('Delete this entry for everyone?')) {
    const id = dl.dataset.delete, e = findEntry(id);
    api.deleteEntry(id).catch(err => toast(errText(err)));
    if (e?.hasPhoto) api.deletePhoto(id).catch(() => {});
    closeSheet(); toast('Deleted');
  }
});

boot();
</script>
</body>
</html>
