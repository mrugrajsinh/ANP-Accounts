<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ANP Accounts">
<meta name="theme-color" content="#fbf3e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1812" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<title>ANP Accounts</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1c1e1b; --muted:#6f7169; --line:#e6e1d6; --grid:#ece8de;
  --accent:#1f5a40; --accent-soft:#e3efe8; --amber:#a86a00; --amber-soft:#fbefd6;
  --red:#b3261e; --red-soft:#fbe3e0; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --on-accent:#fff; --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141614; --card:#1e211e; --ink:#eef0eb; --muted:#9a9e95; --line:#2d312c; --grid:#272b26;
    --accent:#6fcf9f; --accent-soft:#1f3529; --amber:#f0b44c; --amber-soft:#3a2f17;
    --red:#ff8a80; --red-soft:#3d1f1c; --shadow:none; --on-accent:#0e1a13; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + var(--safe-b));min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto}
body.wide .wrap{max-width:1180px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 0 8px}
header .wrap{padding:0 16px}
.htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:10px}
.sync{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:999px;letter-spacing:0}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow);border:1px solid var(--line)}
.monthnav button{width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--accent)}
.monthnav span{font-weight:600;font-size:15px;min-width:86px;text-align:center}
.search{margin-top:10px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus{border-color:var(--accent)}

main{padding:4px 16px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.stat b{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.wide b{font-size:26px}
.stat.warn b{color:var(--amber)}
.stat .x{font-size:12px;color:var(--muted);margin-top:2px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.dhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13.5px;color:var(--muted);font-weight:600}
.dhead b{color:var(--ink);font-variant-numeric:tabular-nums}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card:active{transform:scale(.99)}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .r{text-align:right;flex:none}
.card .amt{font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;margin-top:4px;white-space:nowrap}
.b-paid{background:var(--accent-soft);color:var(--accent)}
.b-credit{background:var(--amber-soft);color:var(--amber)}
.b-over{background:var(--red-soft);color:var(--red)}
.b-mute{background:var(--grid);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty .big{font-size:40px;margin-bottom:8px}
.section-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:22px 4px 8px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--safe-b))}
nav .wrap{display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.dot{position:absolute;left:50%;margin-left:6px;top:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(80px + var(--safe-b));z-index:7;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:32px;line-height:58px;box-shadow:0 6px 18px rgba(31,90,64,.35)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:17px;margin:0;font-weight:700}
.sh-head button{color:var(--accent);font-weight:600;padding:4px 2px;font-size:16px}
.sh-head .save{font-weight:750}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(28px + var(--safe-b))}

.fgroup{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.fgroup h3{margin:0 0 8px;font-size:15px}
.flabel{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--accent)}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date].field{min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.irow{border-top:1px dashed var(--line);padding:10px 0}
.irow:first-of-type{border-top:0;padding-top:2px}
.igrid{display:grid;grid-template-columns:1fr 1.1fr 1.6fr 32px;gap:6px;margin-top:6px;align-items:end}
.igrid label span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:0 0 2px 2px}
.igrid .field{padding:9px 8px}
.i-del{width:32px;height:40px;border-radius:10px;color:var(--red);font-size:22px}
.addi{width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;margin-top:4px}
.totalbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:18px}
.totalbar b{font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.cr{color:var(--amber)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.modes .chip{padding:8px 14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.photo-box{flex-wrap:wrap}.pthumbs{display:flex;flex-wrap:wrap;gap:8px;width:100%}.pth{position:relative}.pth img{display:block}
.pthx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#c62828;color:#fff;font-weight:800;line-height:22px;padding:0}
.rp img{cursor:pointer}
.pbtn{padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pdel{color:var(--red);font-weight:600;padding:10px 4px}

.dt-top{text-align:center;padding:6px 0 14px}
.dt-top .amt{font-size:34px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dt-top .sub{color:var(--muted);font-size:14px}
table.items{width:100%;border-collapse:collapse;font-size:14.5px}
table.items td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.items tr:last-child td{border-bottom:0}
table.items .n{font-weight:600}
table.items .q{color:var(--muted);font-size:13px}
table.items .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right;font-weight:550;word-break:break-all}
.bigphoto{width:100%;border-radius:12px;display:block}
.stat.danger{background:#fdecea;border-color:#f3b8b0}.stat.danger small,.stat.danger b{color:#b3261e}
tr.notback td{background:#fdf1ef}tr.notback td:first-child{box-shadow:inset 4px 0 0 #c62828}
.bulkbtn{margin:0 0 8px}
.rlrow{display:grid;grid-template-columns:1.7fr 1fr 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}.rlrow .field{padding:9px 8px}.rlhead span{font-size:12px;color:var(--muted);font-weight:700}
.pcard-wrap{position:relative}.pcard-wrap .bookbtn{width:100%}.pedit{position:absolute;top:10px;right:44px;border:0;background:rgba(255,255,255,.7);border-radius:50%;width:36px;height:36px;font-size:16px}
.bookbtn.totalcard{border:2px solid var(--accent)}.bookbtn.totalcard .bicon{background:#fbe3cf}
ol.steps{margin:6px 0 0;padding-left:20px;line-height:1.55}ol.steps li{margin-bottom:6px}
.chip.linked{background:#e7f4ea;border-color:#b9dfc3;color:#1e5e23}
.paylist{display:flex;flex-direction:column;gap:6px}.payee{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid #cfdcf5;background:#fff;border-radius:12px;padding:9px 12px;font:inherit}
.payee span{font-size:12.5px;color:var(--muted)}.payee.on{border-color:#1a3d8f;box-shadow:inset 0 0 0 1px #1a3d8f}
.upipay{background:#f3f7ff;border:1px solid #cfdcf5;border-radius:14px;padding:10px 12px;margin:8px 0 10px}
@media (prefers-color-scheme:dark){.upipay{background:#1b2436;border-color:#2c3a57}}
.upito{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.upito .chip{margin:0 0 0 auto;padding:4px 10px;font-size:13px}
.upiapps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.upiapp{border:1px solid #9fb6e6;background:#fff;border-radius:12px;padding:10px 2px;font-weight:700;font-size:13px;color:#1a3d8f}
#upiAsk,#qrScan{position:fixed;inset:0;z-index:1000;display:none}#upiAsk.on{display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
#upiAsk .upibox{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
#qrScan.on{display:block;background:#000}#qrScan video{width:100%;height:100%;object-fit:cover}
#qrScan .qrframe{position:absolute;left:50%;top:45%;width:64vw;height:64vw;max-width:320px;max-height:320px;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#qrScan .qrtop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px}#qrScan .pvx{background:rgba(255,255,255,.9);border:0;border-radius:20px;padding:8px 14px;font-weight:700}
#qrScan .qrbot{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);color:#fff;text-align:center;font-weight:600}#qrScan .qrbot .btn{margin-top:10px}
.paidbox{display:block;width:100%;text-align:left;background:#e7f4ea;border-color:#b9dfc3;color:#1e5e23;font:inherit}
.big-num{font-size:24px;font-weight:700}
textarea.field.big{font-size:18px;line-height:1.5;min-height:130px;resize:vertical}
.bookbtn .bicon.sal{background:#e3f1e0}.bookbtn .bicon.chk{background:#e6ecfb}
@media (prefers-color-scheme:dark){.bookbtn .bicon.sal{background:#1f3a22}.bookbtn .bicon.chk{background:#22304d}}
.attrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.attrow .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attbtns{display:flex;gap:5px}
.ab{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.abF.on{background:#2e7d32;border-color:#2e7d32;color:#fff}.abH.on{background:#b7791f;border-color:#b7791f;color:#fff}.abA.on{background:#c62828;border-color:#c62828;color:#fff}
.card.emp{align-items:flex-start;text-align:left}.card.emp .amt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calhead span{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.cal{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 0 3px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;min-height:42px;color:inherit}
.cal small{font-size:9px;font-weight:700;height:11px}.cal:disabled{opacity:.35}.cal.today{outline:2px solid var(--accent)}
.cal.cF{background:#e3f1e0;border-color:#9fd0a6;color:#1e5e23}.cal.cH{background:#fdf0d5;border-color:#ecc77a;color:#7a5200}.cal.cA{background:#fdecea;border-color:#f3b8b0;color:#b3261e}
.row-add{display:grid;grid-template-columns:1fr 80px auto;gap:6px;align-items:center}
.clrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.clrow:last-child{border-bottom:0}.clrow .main{flex:1;min-width:0}.clrow .t{font-weight:600}.clrow .s{font-size:13px;color:var(--muted)}
.clbox{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:800;color:#fff}
.clrow.got .clbox{background:#2e7d32;border-color:#2e7d32}.clrow.na .clbox{background:#c62828;border-color:#c62828}.clrow.got .t{text-decoration:line-through;color:var(--muted)}
.clrow .chip{padding:6px 10px;font-size:13px;margin:0}.chip.bl{background:#f8cb46;border-color:#e6b52e;color:#1b5e20;font-weight:700;text-decoration:none}
a.btn{display:block;text-align:center;text-decoration:none}
.scard.urgent{border-color:#f3b8b0;box-shadow:inset 4px 0 0 #c62828}
.bk-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}.bk-row:last-child{border-bottom:0}
.bk-row input{width:22px;height:22px;flex:none;accent-color:var(--accent)}.bk-row .main{flex:1;min-width:0}.bk-row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bk-row .s{font-size:13px;color:var(--muted)}.bk-row b{flex:none}
.bk-group{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px;font-weight:700}.bk-group label{display:flex;align-items:center;gap:8px}.bk-group input{width:20px;height:20px;accent-color:var(--accent)}
.bk-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px}
.recite{white-space:pre-wrap;font-size:18px;line-height:1.65;background:#fff8ec;border:1px solid #f0dcb8;border-radius:12px;padding:12px 14px;margin:6px 0 10px}
.rpics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.rpics .rp{position:relative}.rpics img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.rpics .rp .pdel{position:absolute;right:6px;bottom:6px;padding:5px 10px;font-size:12px;background:rgba(255,255,255,.92);border-radius:14px}
#pview{position:fixed;inset:0;background:#000;z-index:999;overflow:auto;display:none}#pview.on{display:flex}#pview img{width:100%;display:block;margin:auto}#pview.z img{width:250%;max-width:none}
#pview .pvx{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;background:rgba(255,255,255,.9);border:0;border-radius:20px;padding:8px 14px;font-weight:700;z-index:2}
#pview .pvh{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;text-align:center;color:#ddd;font-size:13px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-weight:650;font-size:16px;margin-top:10px;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--accent)}
.btn.dan{color:var(--red)}
.btn.amber{background:var(--amber);color:#fff}
.btn:disabled{opacity:.5}
.sbtn{padding:7px 12px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--accent);color:var(--on-accent)}
.sbtn.ghost{background:var(--grid);color:var(--ink)}
.sbtn.red{background:var(--red-soft);color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.more p{color:var(--muted);font-size:14px;margin:6px 0}
.more ol{padding-left:20px;margin:6px 0;font-size:14.5px}
.trow{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left}
.trow .main{flex:1;min-width:0}
.trow .t{font-weight:600;font-size:16px;word-break:break-word}
.trow .s{font-size:13px;color:var(--muted);margin-top:2px}

<script type="module">
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INR = new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:0, maximumFractionDigits:2});
const INR2 = new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:2, maximumFractionDigits:2});
const money = n => { const v = Math.round((+n || 0) * 100) / 100; return (Number.isInteger(v) ? INR : INR2).format(v); };
const moneyShort = n => { n = +n || 0; const a = Math.abs(n);
  if (a >= 1e7) return '₹' + +(n/1e7).toFixed(1) + 'Cr';
  if (a >= 1e5) return '₹' + +(n/1e5).toFixed(1) + 'L';
  if (a >= 1e3) return '₹' + +(n/1e3).toFixed(1) + 'k';
  return '₹' + Math.round(n); };
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const prettyDate = s => parse(s).toLocaleDateString(LOC(), {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const shortDate = s => parse(s).toLocaleDateString(LOC(), {day:'numeric', month:'short'});
const monthLabel = m => parse(m + '-01').toLocaleDateString(LOC(), {month:'short', year:'numeric'});
const monthStart = (s, back = 0) => { const d = parse(s); d.setDate(1); d.setMonth(d.getMonth() - back); return ds(d); };
const monthEnd = s => { const d = parse(s); d.setMonth(d.getMonth() + 1, 0); return ds(d); };

  const c = e?.code || '';

    'auth/email-already-in-use':'An account with this email already exists — sign in instead','auth/weak-password':'Password must be at least 6 characters',

    'auth/network-request-failed':'No internet connection','permission-denied':'You don\'t have access to do that'})[c] || e?.message || String(e);

  let n = 0;
  const add = (book, date, items, credit, who, mode) => { const id = 'e' + (n++); entries[id] = {id, book, date, vendor: book, items, status: credit ? 'credit' : 'paid', mode: credit ? null : mode,
    ref: '', dueDate: credit ? addDays(date, 30) : null, paidOn: null, createdBy: who, createdByName: users[who].name, createdAt: Date.now() - n * 1e5, notes: ''}; return entries[id]; };
  for (let d = 0; d < 40; d++) {
    const date = addDays(today(), -d);
    if (d % 2 === 0) { const it = []; for (let q = 0; q < 1 + (d % 3); q++) { const c = G[(d + q * 3) % G.length], qty = 1 + ((d + q) % 4); it.push({name: c[0], unit: c[1], qty, rate: c[2], amount: qty * c[2]}); } add('ganesh', date, it, d % 6 === 0, d % 4 ? 'u-2' : 'u-admin', d % 3 ? 'Cash' : 'UPI'); }
    { const it = []; for (let q = 0; q < 2 + (d % 3); q++) { const c = V[(d * 2 + q) % V.length], qty = c[1] === 'kg' ? (q % 2 ? 0.5 : 1) : 2 + q; it.push({name: c[0], unit: c[1], qty, rate: c[2], amount: qty * c[2]}); } add('veg', date, it, false, 'u-2', 'Cash'); }
    if (d < 25 && d % 1 === 0 && d % 3 !== 2) {
      const r = settings.ironRates, it = [{cat: 'Shirt', wash: d % 2 ? 2 : 0, iron: 3 + (d % 4)}, {cat: 'Saree', wash: d % 5 === 0 ? 1 : 0, iron: d % 3 ? 1 : 0}].filter(x => x.wash || x.iron)
        .map(x => { const rr = r.find(y => y.cat === x.cat); return {name: x.cat, cat: x.cat, wash: x.wash, iron: x.iron, qty: x.wash + x.iron, unit: 'pcs', washRate: rr.wash, ironRate: rr.iron, rate: 0, amount: x.wash * rr.wash + x.iron * rr.iron}; });
      const e = add('iron', date, it, true, 'u-2', null);
      if (d > 1) { const c = it.reduce((a, i) => ({w: a.w + i.wash, i: a.i + i.iron}), {w: 0, i: 0}); e.retWash = c.w; e.retIron = c.i; e.retOn = addDays(date, 2); }
    }
  }
  const T = (title, who, status, extra = {}) => { const id = 't' + (n++); tasks[id] = {id, date: today(), title, assignedTo: who, assignedName: who ? users[who].name : '', createdBy: 'u-papa', createdByName: 'Papa', createdAt: Date.now() - n * 6e5,
    status, done: status === 'done', hasVoice: false, hasPhoto: false, ...extra}; };
  T('bed ki repair karwani hai', 'u-ram', 'open');
  [['Hall lights', 'Hall', 'Board near main door:\n1st switch = ceiling fan\n2nd = chandelier\n3rd = cove lights\n4th = night lamp'], ['Steam room', 'Steam & sauna', 'Main switch outside door (red). Set 45°C on panel, wait 15 min. Switch off after use.'], ['Geyser – hot water', 'Bathroom', 'Switch above mirror. Hot water ready in 10 min. Blue knob = cold, red = hot.']]
    .forEach(([name, room, place], k) => { const id = 'gd' + k; entries[id] = {id, book: 'guide', date: today(), name, room, place, note: '', hasPhoto: false, items: [], createdBy: 'u-admin', createdByName: 'Mrugraj', createdAt: Date.now() - k * 9e6, updatedAt: Date.now() - k * 9e6, updatedByName: 'Mrugraj'}; });
  [['Pooja thali', 'Pooja room', 'Mandir ke neeche wali drawer, left side'], ['Extra gas cylinder key', 'Kitchen', 'Fridge ke upar steel dabba'], ['Diwali diya box', 'Store room', 'Upar wali shelf, laal box'], ['Inverter warranty card', 'Hall', 'TV unit ki pehli drawer']]
    .forEach(([name, room, place], k) => { const id = 'th' + k; entries[id] = {id, book: 'things', date: today(), name, room, place, note: '', hasPhoto: false, items: [], createdBy: 'u-2', createdByName: 'Mummy', createdAt: Date.now() - k * 9e6, updatedAt: Date.now() - k * 9e6, updatedByName: 'Mummy'}; });

  users['u-sunil'] = {name: 'Sunil (helper)', email: 'sunil@example.com', status: 'approved', role: 'member', createdAt: Date.now()};
  presence['u-ram'] = {name: 'Ramesh (worker)', at: Date.now() - 2 * 6e4, atHome: true, loc: 'on'};
  presence['u-sunil'] = {name: 'Sunil (helper)', at: Date.now() - 4 * 6e4, atHome: true, loc: 'on'};
  presence['u-2'] = {name: 'Mummy', at: Date.now() - 50 * 6e4, atHome: false, loc: 'on'};
  settings.home = {lat: 22.7, lng: 71.6, r: 150};
  T('Pay electricity bill', 'u-2', 'review', {hasProof: true, submittedBy: 'u-2', submittedByName: 'Mummy', submittedAt: Date.now() - 3e6, proofNote: 'Paid ₹1,240 by UPI'});
  T('aangan ki safai', 'u-ram', 'open', {declinedAt: Date.now() - 2e6, declinedBy: 'u-papa', declinedByName: 'Papa', declineNote: 'corner abhi bhi ganda hai'});
  T('Water the plants', 'u-ram', 'done', {approvedBy: 'u-papa', approvedByName: 'Papa', approvedAt: Date.now() - 5e6, doneDate: today()});
  const emit = () => listeners.forEach(f => f());
  const watch = (fn) => { listeners.add(fn); fn(); return () => listeners.delete(fn); };
  return {
    demo: true,
    onAuth: cb => setTimeout(() => cb(me), 50),
    signIn: async () => {}, signUp: async () => me, reset: async () => {}, signOut: async () => location.reload(),
    sendVerify: async () => {}, refresh: async () => me,
    watchMe: (uid, cb) => watch(() => cb(users[uid] || null)),
    createMe: async (uid, d) => { users[uid] = d; emit(); },
    watchUsers: cb => watch(() => cb(Object.entries(users).map(([uid, u]) => ({uid, ...u})))),
    updateUser: async (uid, p) => { Object.assign(users[uid], p); emit(); },
    idToken: async () => null, pushToken: async () => null,
    watchEntries: (since, cb) => watch(() => cb(Object.values(entries).filter(e => e.date >= since).map(e => ({...e})))),
    watchCredits: cb => watch(() => cb(Object.values(entries).filter(e => e.status === 'credit').map(e => ({...e})))),
    watchBook: (book, cb) => watch(() => cb(Object.values(entries).filter(e => e.book === book).map(e => ({...e})))),
    fetchRange: async (f, t) => Object.values(entries).filter(e => e.date >= f && e.date <= t).map(e => ({...e})),
    newId: () => 'e' + (n++),
    saveEntry: async e => { entries[e.id] = JSON.parse(JSON.stringify(e)); emit(); },
    deleteEntry: async id => { delete entries[id]; emit(); },
    savePhoto: async (id, d) => { photos[id] = d; }, getPhoto: async id => photos[id] || null, deletePhoto: async id => { delete photos[id]; },
    watchSettings: cb => watch(() => cb({...settings})),
    watchPresence: cb => watch(() => cb(Object.entries(presence).map(([uid, p]) => ({uid, ...p})))),
    setPresence: async (uid, d) => { presence[uid] = {...(presence[uid] || {}), ...d}; emit(); },
    watchTasks: (since, cb) => watch(() => cb(Object.values(tasks).filter(t => t.date >= since).map(t => ({...t})))),
    watchOpenTasks: cb => watch(() => cb(Object.values(tasks).filter(t => !t.done).map(t => ({...t})))),
    newTaskId: () => 't' + (n++),
    saveTask: async t => { tasks[t.id] = JSON.parse(JSON.stringify(t)); emit(); },
    deleteTask: async id => { delete tasks[id]; emit(); },
    saveSettings: async p => { Object.assign(settings, p); emit(); },
  };
}

// translate one UI string; composite "A · B" strings are translated part by part
function tx(str) {
  if (LI < 0 || !str) return str;
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/), core = m[2];
  if (!core) return str;
  const one = s => {
    if (D[s]) return D[s][LI];
    for (const [re, out] of PATTERNS) { const mm = s.match(re); if (mm) return out[LI].replace(/\$(\d)/g, (_, i) => tx(mm[+i] || '')); }
    return null;
  };
  let out = D[core] ? D[core][LI] : null;
  if (out == null && core.includes(' · ')) { const parts = core.split(' · '), tr = parts.map(p => tx(p)); if (tr.some((p, i) => p !== parts[i])) out = tr.join(' · '); }
  if (out == null) out = one(core);
  if (out == null) { const em = core.match(/^(\p{Extended_Pictographic}\S*) (.+)$/u); if (em) { const r = tx(em[2]); if (r !== em[2]) out = em[1] + ' ' + r; } }
  return out == null ? str : m[1] + out + m[3];
}
function txNode(root) {
  if (LI < 0 || !root) return;
  const skip = el => !el || !el.closest || !!el.closest('[data-nt],script,style,textarea,audio');
  if (root.nodeType === 3) { if (!skip(root.parentElement)) { const v = tx(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
  if (root.nodeType !== 1 || root.closest('[data-nt]')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) { if (skip(n.parentElement)) continue; const v = tx(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  const els = root.querySelectorAll ? [root, ...root.querySelectorAll('[placeholder],[aria-label]')] : [];
  for (const el of els) { if (!el.getAttribute || el.closest('[data-nt]')) continue;
    for (const a of ['placeholder', 'aria-label']) { const v = el.getAttribute(a); if (v) { const t = tx(v); if (t !== v) el.setAttribute(a, t); } } }
}
if (LI >= 0) {

const APP_VERSION = '44 · iron total at bottom';
const PAY = ['Cash', 'UPI'];
const unitFactor = u => (u === 'g' || u === 'ml') ? 0.001 : 1;          // rate is per kg / per L for g / ml
const rateUnit = u => u === 'g' ? '/kg' : u === 'ml' ? '/L' : '';
const lineAmt = (qty, rate, unit) => r2(num(qty) * num(rate) * unitFactor(unit));
const bookOf = e => BOOKS[e.book] ? e.book : 'ganesh';
const DEFAULT_RATES = ['Shirt', 'T-shirt', 'Pant', 'Saree', 'Kurta', 'Dress', 'Bedsheet', 'Blanket'].map(c => ({cat: c, wash: 0, iron: 0}));
const ironRates = () => (Array.isArray(S.settings?.ironRates) && S.settings.ironRates.length ? S.settings.ironRates : DEFAULT_RATES);
const rateOf = cat => ironRates().find(r => r.cat.trim().toLowerCase() === String(cat || '').trim().toLowerCase()) || {cat, wash: 0, iron: 0};
// Bring saved rates into entries: unpaid entries take the current rates; paid ones only fill rates that were missing (₹0).
function syncRates(opts = {}) {
  if (!S.isAdmin) return 0;
  let n = 0;
  for (const e of S.entries) {
    const k = bookOf(e), pend = e.status !== 'paid' && !e.paidOn;
    let items;
    if (k === 'iron' && (opts.iron ?? true)) items = (e.items || []).map(i => { if (i.other) return i;
      const r = rateOf(i.cat || i.name), w = num(r.wash), ir = num(r.iron);
      if (!w && !ir) return i;
      const wr = pend || !num(i.washRate) ? w : num(i.washRate), irr = pend || !num(i.ironRate) ? ir : num(i.ironRate);
      return {...i, washRate: wr, ironRate: irr, amount: r2(num(i.wash) * wr + num(i.iron) * irr)}; });
    else if ((k === 'ganesh' || k === 'veg') && (opts.list ?? true)) items = (e.items || []).map(i => { if (num(i.amount)) return i;
      const r = rateFor(k, i.name); return r && num(r.rate) ? {...i, amount: lineAmt(i.qty || 1, r.rate, i.unit || r.unit), rate: num(r.rate)} : i; });
    else continue;
    if (JSON.stringify(items) === JSON.stringify(e.items)) continue;
    const u = {...strip(e), items, updatedAt: Date.now(), updatedByName: S.me.name};
    api.saveEntry(u).catch(er => toast(errText(er))); Object.assign(e, u); n++;
  }
  if (n) { mergeEntries(); render(); }
  return n;
}
const ironCounts = e => (e.items || []).reduce((a, i) => ({wash: a.wash + num(i.wash), iron: a.iron + num(i.iron)}), {wash: 0, iron: 0});
const ironOthers = e => (e.items || []).filter(i => i.other).reduce((t, i) => t + num(i.amount), 0);
function returnState(e) {
  const g = ironCounts(e), given = g.wash + g.iron, back = num(e.retWash) + num(e.retIron);
  if (!given) return {txt: '', cls: ''};
  if (back >= given) return {txt: `Returned ${e.retOn ? shortDate(e.retOn) : ''}`, cls: 'b-paid', done: true};
  if (back > 0) return {txt: `Returned ${back}/${given}`, cls: 'b-over'};
  return {txt: 'Not returned', cls: 'b-over'};
}

function mergeEntries() {
  const m = new Map([...S.live, ...S.credits]);
  for (const [k, e] of m) if (e.book && !BOOKS[e.book]) m.delete(k);
  S.entries = [...m.values()].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  S.rangeCache = null;
}
function itemHistory(book) {
  const items = new Map();
  for (const e of S.entries) if (bookOf(e) === book) for (const i of e.items || []) {
    const k = (i.name || '').trim().toLowerCase();
    if (k && !items.has(k)) items.set(k, {name: i.name.trim(), rate: i.rate, unit: i.unit, qty: i.qty, amount: i.amount});
  }
  const names = new Set([...rateList(book).map(r => r.name), ...[...items.values()].map(i => i.name)]);
  $('#dl-items').innerHTML = [...names].map(n => `<option value="${esc(n)}">`).join('');
  return items;
}

const configured = () => CFG.firebase && CFG.firebase.apiKey && !String(CFG.firebase.apiKey).startsWith('PASTE');

async function boot() {
  const demo = new URLSearchParams(location.search).has('demo');
  if (!configured() && !demo) return screenSetup();
  try { api = demo ? demoAPI() : await firebaseAPI(CFG.firebase); }
  catch (e) { return screenMsg('Could not connect', `Check your internet connection and reload.<br><small>${esc(e.message)}</small>`, true); }
  api.onAuth(onUser);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
    // when a new version installs, reload once so it shows straight away
    navigator.serviceWorker.addEventListener('message', ev => { const u = ev.data && (ev.data.url || (ev.data.go && './?go=' + ev.data.go)); if (u) navFromUrl(u); });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !S.reloaded) { S.reloaded = true; location.reload(); } });
  }
  addEventListener('online', updateSync); addEventListener('offline', updateSync);
}

function stopWatching() { S.unsub.forEach(f => { try { f(); } catch {} }); S.unsub = []; }

function onUser(user) {
  stopWatching(); closeSheet();
  S.user = user; S.me = null; S.started = false;
  if (!user) return screenLogin('in');
  S.isOwner = !!(user.email && user.email.toLowerCase() === ADMIN);
  S.isAdmin = S.isOwner;
  S.unsub.push(api.watchMe(user.uid, async doc => {
    if (!doc) {
      const d = {name: user.name || user.email.split('@')[0], email: user.email.toLowerCase(), createdAt: Date.now(),
        status: S.isOwner ? 'approved' : 'pending', role: S.isOwner ? 'admin' : 'member'};
      try { await api.createMe(user.uid, d); } catch (e) { screenMsg('Setup problem', esc(errText(e)) + '<br><br>Check that the Firestore rules were published.', true); }
      return;
    }
    S.me = doc;
    S.isAdmin = S.isOwner || doc.role === 'admin';
    S.isStaff = !S.isAdmin && doc.role === 'staff';
    if (S.started && S.wasStaff !== undefined && S.wasStaff !== S.isStaff) return location.reload();
    S.wasStaff = S.isStaff;
    if (S.isAdmin || doc.status === 'approved') { if (!S.started) startApp(); else render(); }
    else if (doc.status === 'pending') { S.started = false; screenMsg('Waiting for approval', `Hi <b>${esc(doc.name)}</b>, your account is created.<br>Ask the admin to approve you. This screen opens by itself once approved.`, true); }
    else { S.started = false; screenMsg('Access removed', 'The admin has removed your access. Contact them if this is a mistake.', true); }
  }, e => screenMsg('Setup problem', esc(errText(e)) + '<br><br>Check that the Firestore rules were published.', true)));
}

// open the exact screen an alert points to: ?go=tasks&task=ID | book&book=K&entry=ID | salary&emp=ID | lists&list=ID
function navFromUrl(u, tries = 0) {
  let q; try { q = new URL(u, location.href).searchParams; } catch { return; }
  const go = q.get('go'); if (!go) return;
  if (!S.started) return setTimeout(() => navFromUrl(u, tries), 500);
  if (S.isStaff && go !== 'tasks') return;
  const id = q.get('task') || q.get('entry') || q.get('emp') || q.get('list');
  const found = !id ? true : go === 'tasks' ? !!findTask(id) : go === 'book' ? !!findEntry(id) : go === 'salary' ? !!findEmp(id) : go === 'lists' ? !!findList(id) : true;
  if (!found && tries < 16) return setTimeout(() => navFromUrl(u, tries + 1), 500);   // data still loading
  closeSheet();
  if (go === 'book' && BOOKS[q.get('book')]) { S.book = q.get('book'); const e = findEntry(id); if (e) S.month = e.date.slice(0, 7); S.view = 'book'; }
  else if (['tasks', 'home', 'salary', 'lists'].includes(go)) S.view = go;
  if (go === 'tasks' && id) { const t = findTask(id); if (t) S.taskDay = t.date; }
  render(); scrollTo(0, 0);
  if (!id || !found) return;
  if (go === 'tasks') openTask(id); else if (go === 'book') openDetail(id); else if (go === 'salary') openEmp(id); else if (go === 'lists') openList(id);
}

async function ensureMonth() {
  const from = S.month + '-01';
  if (from >= S.since) return;
  try { const list = await api.fetchRange(from, monthEnd(from)); list.forEach(e => S.live.set(e.id, e)); mergeEntries(); render(); } catch (e) { toast(errText(e)); }
}
function updateSync() {
  const el = $('#sync'); if (!el) return;
  const pending = S.entries.some(e => e._pending) || S.taskList.some(t => t._pending);
  if (!navigator.onLine) { el.textContent = 'Offline'; el.classList.remove('hidden'); }
  else if (pending) { el.textContent = 'Syncing…'; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
}

function render() {
  if (!S.started || !$('#main')) return;
  if (S.isStaff && S.view !== 'tasks' && S.view !== 'more') S.view = 'tasks';

  $('#title').textContent = inBook ? BOOKS[S.book].name + (S.book === 'iron' && S.ironPerson != null && ironPeople().length ? ' · ' + (S.ironPerson === '*' ? tx('Total') : personName(S.ironPerson)) : '') : {home: 'ANP Accounts', tasks: S.isStaff ? 'My tasks' : 'Tasks', dash: 'Dashboard', more: S.isAdmin ? 'Users' : 'Account', salary: 'Salary', lists: 'Checklists'}[v];
  $('#title').toggleAttribute('data-nt', inBook);
  $('#renameBook').classList.toggle('hidden', !(inBook && S.isAdmin));

  $('#monthnav').classList.toggle('hidden', !inBook);
  $('#search').classList.toggle('hidden', !(inBook && S.book !== 'iron'));
  $('#search').placeholder = tx('Search item…');
  $('#xlBtn').classList.toggle('hidden', v !== 'dash');
  $('#hdrLang').classList.toggle('hidden', v !== 'home');
  $('#fab').classList.toggle('hidden', !(sub || (v === 'tasks' && !S.isStaff)) || (v === 'salary' && !S.isAdmin));
  $('#mLabel').textContent = monthLabel(S.month);
  const act = myTaskActions().length;
  $('#dot-tasks').textContent = act; $('#dot-tasks').classList.toggle('hidden', !act);

function badge(e) {
  if (e.status === 'paid') return `<span class="badge b-paid">Paid · ${esc(e.mode || 'Cash')}</span>`;
  if (e.paidOn) return `<span class="badge b-paid">Credit cleared</span>`;
  if (!e.dueDate) return `<span class="badge b-credit">Credit</span>`;
  const d = daysBetween(today(), e.dueDate);
  if (d < 0) return `<span class="badge b-over">Overdue ${-d}d</span>`;
  if (d === 0) return `<span class="badge b-over">Due today</span>`;
  return `<span class="badge b-credit">Credit · due ${d}d</span>`;
}

// per-cloth return: each item keeps its own retOn; entry totals (retWash/retIron/retOn) are worked out from them
function itemBack(e, i) {
  if (i.retOn) return i.retOn;
  const anyItem = (e.items || []).some(x => x.retOn);
  return !anyItem && returnState(e).done ? (e.retOn || true) : '';
}
function retTotals(items) {
  const back = items.filter(i => i.retOn);
  return {retWash: back.reduce((t, i) => t + num(i.wash), 0), retIron: back.reduce((t, i) => t + num(i.iron), 0),
    retOn: back.map(i => i.retOn).sort().pop() || null};
}
function setReturned(id, idx) {   // idx = item index, or null for all
  const e = findEntry(id); if (!e) return;
  const items = (e.items || []).map(i => ({...i, ...(itemBack(e, i) && !i.retOn ? {retOn: e.retOn || today()} : {})}));
  if (idx == null) items.forEach(i => { if (num(i.wash) + num(i.iron) && !i.retOn) i.retOn = today(); });
  else { const i = items[idx]; if (i.retOn) delete i.retOn; else i.retOn = today(); }
  const u = {...strip(e), items, ...retTotals(items), retByName: S.me.name, updatedAt: Date.now(), updatedByName: S.me.name};
  api.saveEntry(u).catch(er => toast(errText(er))); Object.assign(e, u); mergeEntries(); render(); openDetail(id);
  toast(idx == null ? 'All returned' : items[idx].retOn ? 'Returned' : 'Undone');
  tellAdmins(`👕 ${who()}: ${idx == null ? 'all clothes returned' : items[idx].retOn ? (items[idx].other ? items[idx].note || 'Others' : items[idx].name) + ' returned' : 'return undone'}`, `${BOOKS.iron.name} · given ${shortDate(e.date)}`, 'r-' + e.id);
}

/* ================= salary: attendance, advance, payouts ================= */
// Each person is one doc (book 'emp'): att = {date: 'F'|'H'|'A'}, adv = [{id, date, amount, note}], paid = {'YYYY-MM': {on, amount, mode, ref}}
const daysIn = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
function empMonth(x, ym) {
  const att = x.att || {}, d = Object.keys(att).filter(k => k.startsWith(ym));
  const F = d.filter(k => att[k] === 'F').length, H = d.filter(k => att[k] === 'H').length, A = d.filter(k => att[k] === 'A').length;
  const base = x.basis === '30' ? 30 : daysIn(ym), perDay = num(x.salary) / base, half = (x.halfPct ?? 50) / 100;
  const earned = r2(perDay * (F + H * half)), adv = sum((x.adv || []).filter(a => (a.date || '').startsWith(ym)), a => num(a.amount));
  return {F, H, A, marked: d.length, perDay: r2(perDay), half, earned, adv, payable: r2(earned - adv), paid: (x.paid || {})[ym] || null, base};
}
function saveEmp(x) { x.updatedAt = Date.now(); x.updatedByName = S.me.name; api.saveEntry(strip(x)).catch(e => toast(errText(e))); }

        <div id="bkRefWrap" class="hidden"><div id="bkUpi"></div><label class="flabel">UTR (optional)</label><input class="field" id="bkRef" autocomplete="off" autocapitalize="characters" placeholder="e.g. 431245678901"></div></div>

function toJpeg(img, max, q) {
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that photo')); i.src = src; }); }
async function fitPhoto(img) { // Firestore docs max 1 MB; keep photos ~<600 KB
  let max = 1200, q = 0.65, out = toJpeg(img, max, q);
  while (out.length > 600000 && max > 500) { max -= 200; q -= 0.05; out = toJpeg(img, max, q); }
  return out;
}
let photoCb = null;
function viewPhoto(src) { if (!src) return; let v = $('#pview');
  if (!v) { v = document.createElement('div'); v.id = 'pview'; v.innerHTML = '<button class="pvx">Close</button><img alt=""><div class="pvh">Tap the photo to zoom</div>'; document.body.appendChild(v);
    v.querySelector('.pvx').onclick = () => { v.classList.remove('on', 'z'); }; v.querySelector('img').onclick = () => v.classList.toggle('z'); }
  v.querySelector('img').src = src; v.classList.remove('z'); v.classList.add('on'); v.scrollTop = 0; }
function pickPhoto(camera, cb) { photoCb = cb; (camera ? $('#taskPhotoInput') : $('#photoInput')).click(); }
async function onPicked(ev) {
  const fs = [...ev.target.files]; ev.target.value = '';

  for (const f of fs.slice(0, 8)) {
    const url = URL.createObjectURL(f);
    try { photoCb(await fitPhoto(await loadImg(url))); } catch (err) { toast(err.message); }
    URL.revokeObjectURL(url);
  }
}
$('#photoInput').onchange = onPicked; $('#taskPhotoInput').onchange = onPicked;

// UPI apps never report back to a web app, so when the person returns we simply ask "Did it go through?"
function upiOf(key) { let l = null; try { l = JSON.parse(localStorage.getItem('upi_' + key) || 'null'); } catch {} return l || (S.settings?.upi || {})[key]; }
// saved UPI IDs: shared list (admins) + this phone's list
function payees() {
  let l = []; try { l = JSON.parse(localStorage.getItem('payees') || '[]'); } catch {}
  const all = [...(S.settings?.payees || []), ...l, ...Object.values(S.settings?.upi || {})];
  const m = new Map(); all.forEach(p => { if (p?.pa && !m.has(p.pa.toLowerCase())) m.set(p.pa.toLowerCase(), p); }); return [...m.values()];
}
async function savePayees(list) {
  try { localStorage.setItem('payees', JSON.stringify(list)); } catch {}
  if (S.isAdmin) { try { await api.saveSettings({payees: list}); S.settings.payees = list; } catch {} }
}
async function addPayee(p) { const l = payees().filter(x => x.pa.toLowerCase() !== p.pa.toLowerCase()); l.unshift({pa: p.pa, pn: p.pn || '', ...(p.mc ? {mc: p.mc} : {})}); await savePayees(l); }

function parseUpi(text) {

// QR scanner: camera (BarcodeDetector where available, else jsQR) or a photo of the QR
async function loadJsQR() {
  if (window.jsQR) return window.jsQR;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; sc.onload = res; sc.onerror = () => rej(new Error('QR reader could not load')); document.head.appendChild(sc); });
  return window.jsQR;
}
async function decodeCanvas(cv) {
  if ('BarcodeDetector' in window) { try { const r = await new BarcodeDetector({formats: ['qr_code']}).detect(cv); if (r[0]) return r[0].rawValue; } catch {} }
  const J = await loadJsQR(), ctx = cv.getContext('2d', {willReadFrequently: true}), im = ctx.getImageData(0, 0, cv.width, cv.height);
  const r = J(im.data, cv.width, cv.height, {inversionAttempts: 'attemptBoth'}); return r ? r.data : null;
}
async function openQrScanner(cb) {
  let d = $('#qrScan'); if (!d) { d = document.createElement('div'); d.id = 'qrScan'; document.body.appendChild(d); }
  d.innerHTML = `<video playsinline muted autoplay></video><div class="qrframe"></div><div class="qrtop"><button class="pvx" id="qrClose">Close</button></div>
    <div class="qrbot"><div>${tx("Point at the shop's UPI QR")}</div><button class="btn sec" id="qrPhoto">🖼 ${tx('Pick QR photo instead')}</button><input type="file" accept="image/*" id="qrFile" hidden></div>`;
  d.classList.add('on');
  const video = d.querySelector('video'), cv = document.createElement('canvas'); let stream = null, alive = true;
  const stop = () => { alive = false; stream?.getTracks().forEach(t => t.stop()); d.classList.remove('on'); d.innerHTML = ''; };
  const got = t => { if (!t || !alive) return; stop(); cb(t); };
  $('#qrClose').onclick = stop;
  $('#qrPhoto').onclick = () => $('#qrFile').click();
  $('#qrFile').onchange = async ev => { const f = ev.target.files[0]; if (!f) return; const img = await loadImg(URL.createObjectURL(f));
    const sc = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight)); cv.width = img.naturalWidth * sc; cv.height = img.naturalHeight * sc;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); const t = await decodeCanvas(cv).catch(() => null); t ? got(t) : toast('No QR found in that photo'); };
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false}); video.srcObject = stream; await video.play(); }
  catch (e) { toast('Camera not available – pick a QR photo'); return; }
  const tick = async () => { if (!alive) return;
    if (video.videoWidth) { cv.width = Math.min(800, video.videoWidth); cv.height = cv.width * video.videoHeight / video.videoWidth; cv.getContext('2d', {willReadFrequently: true}).drawImage(video, 0, 0, cv.width, cv.height);
      const t = await decodeCanvas(cv).catch(() => null); if (t) return got(t); }
    setTimeout(tick, 250); };
  tick();
}

/* ================= voice notes ================= */
const VLANGS = [['hi-IN', 'हिन्दी / Hinglish'], ['gu-IN', 'ગુજરાતી'], ['en-IN', 'English']];
const vLang = () => { try { return localStorage.getItem('vLang') || 'hi-IN'; } catch { return 'hi-IN'; } };
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const Rec = {
  mr: null, stream: null, sr: null, chunks: [], t0: 0, timer: null,
  supported: () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder),
  async start(onTick, onText) {
    this.stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
    this.mr = new MediaRecorder(this.stream, type ? {mimeType: type, audioBitsPerSecond: 32000} : {audioBitsPerSecond: 32000});
    this.chunks = []; this.mr.ondataavailable = e => e.data && e.data.size && this.chunks.push(e.data);
    this.mr.start(250); this.t0 = Date.now();
    this.timer = setInterval(() => { const s = Math.round((Date.now() - this.t0) / 1000); onTick(s); if (s >= 60) this.onLimit && this.onLimit(); }, 250);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR && onText) {
      try { const r = new SR(); r.lang = vLang(); r.interimResults = true; r.continuous = true;
        r.onresult = ev => { let t = ''; for (const res of ev.results) t += res[0].transcript + ' '; onText(t.trim()); };
        r.onerror = () => {}; r.start(); this.sr = r; } catch { this.sr = null; }
    }
  },
  stop() {
    return new Promise(res => {
      const mr = this.mr; if (!mr) return res(null);
      clearInterval(this.timer);
      const secs = Math.round((Date.now() - this.t0) / 1000);
      mr.onstop = async () => {
        this.stream?.getTracks().forEach(t => t.stop());
        const blob = new Blob(this.chunks, {type: mr.mimeType || 'audio/webm'});
        this.mr = null; this.stream = null;
        res(blob.size ? {data: await blobToDataURL(blob), secs} : null);
      };
      try { this.sr?.stop(); } catch {} this.sr = null;
      mr.stop();
    });
  },
  cancel() { if (this.mr) { try { this.mr.onstop = null; this.mr.stop(); } catch {} } clearInterval(this.timer); this.stream?.getTracks().forEach(t => t.stop()); try { this.sr?.abort(); } catch {} this.mr = null; this.stream = null; this.sr = null; },
};
// Renders a record/playback widget inside `el`. state = {data}; onText(transcript) optional.
function mountVoice(el, state, onText) {
  const draw = (rec, secs) => {
    el.innerHTML = rec
      ? `<button type="button" class="vbtn rec" data-vstop>■ Stop · ${secs || 0}s</button><span class="hint">Speak now… (max 60s)</span>`
      : state.data
        ? `<audio controls src="${state.data}"></audio><button type="button" class="pdel" data-vdel>Remove</button>`
        : Rec.supported() ? `<button type="button" class="vbtn" data-vrec>🎤 Record voice note</button>
            <select class="field vlang" style="width:auto;padding:7px 28px 7px 10px;font-size:14px">${VLANGS.map(([c, l]) => `<option value="${c}" ${vLang() === c ? 'selected' : ''}>${l}</option>`).join('')}</select>`
          : `<span class="hint">Voice recording isn't supported on this phone's browser.</span>`;
  };
  draw(false);
  el.onchange = ev => { if (ev.target.classList.contains('vlang')) try { localStorage.setItem('vLang', ev.target.value); } catch {} };
  el.onclick = async ev => {
    if (ev.target.closest('[data-vrec]')) {
      try { Rec.onLimit = () => el.querySelector('[data-vstop]')?.click(); await Rec.start(s => { const b = el.querySelector('[data-vstop]'); if (b) b.textContent = `■ Stop · ${s}s`; }, onText); draw(true, 0); }
      catch (e) { toast('Microphone not allowed. Allow it in phone settings.'); }
    }
    if (ev.target.closest('[data-vstop]')) {
      const r = await Rec.stop();
      if (r && r.data.length > 900000) toast('Too long. Keep voice notes under 1 minute.');
      else if (r) state.data = r.data;
      draw(false);
    }
    if (ev.target.closest('[data-vdel]')) { state.data = null; draw(false); }
  };
}
function playerHTML(slotId, label) { return `<div class="vplay" id="${slotId}"><span class="hint">${label} · loading…</span></div>`; }
function loadPlayer(slotId, mediaId, label) {

/* ================= translation (Google Translate, no key) ================= */
const LANGS = [['', 'Original'], ['en', 'English'], ['gu', 'ગુજરાતી'], ['hi', 'हिन्दी']];
const TR = (() => { try { return JSON.parse(localStorage.getItem('trCache') || '{}'); } catch { return {}; } })();
const trKey = (tl, txt) => tl + '|' + txt;
let trSaveT;
function trLang() { return APPLANG === 'gu' ? 'gu' : APPLANG === 'hn' ? '' : 'en'; }
function trLink(tl, txt) { return `https://translate.google.com/?sl=auto&tl=${tl}&text=${encodeURIComponent(txt)}&op=translate`; }
const trPending = new Set();
async function translate(tl, txt) {
  const k = trKey(tl, txt);
  if (k in TR || trPending.has(k)) return TR[k];
  trPending.add(k);
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    TR[k] = {t: (d[0] || []).map(x => x[0]).join('').trim(), src: d[2] || ''};
  } catch { TR[k] = {err: true}; }
  trPending.delete(k);
  clearTimeout(trSaveT); trSaveT = setTimeout(() => { try { const ks = Object.keys(TR); if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(x => delete TR[x]); localStorage.setItem('trCache', JSON.stringify(TR)); } catch {} }, 500);
  return TR[k];
}
function trLine(txt) {
  const tl = trLang(); if (!tl || !txt) return '';
  const c = TR[trKey(tl, txt)];
  if (!c) { const k = trKey(tl, txt); if (!trPending.has(k)) translate(tl, txt).then(() => { clearTimeout(trLine._t); trLine._t = setTimeout(() => S.view === 'tasks' && render(), 60); }); return `<div class="tr">…</div>`; }

  if (!c.t || c.t.toLowerCase() === txt.toLowerCase() || c.src === tl) return '';

function taskAlerts() {
  if (!S.user) return;
  const sig = t => tStatus(t) + '|' + (t.declinedAt || 0) + '|' + (t.assignedTo || '');
  let seen; try { seen = JSON.parse(localStorage.getItem('taskSeen') || 'null'); } catch { seen = null; }
  const first = !S.taskSeenInit; S.taskSeenInit = true;
  const now = {}, msgs = [];
  for (const t of S.taskList) {
    now[t.id] = sig(t);
    if (!seen || seen[t.id] === now[t.id] || t._pending) continue;
    const st = tStatus(t), by = t.updatedBy || t.createdBy;
    if (by === S.user.uid) continue;
    if (S.isStaff && !staffMine(t)) continue;
    const newForMe = isMine(t) && openish(st) && (!(t.id in seen) || String(seen[t.id]).split('|')[2] !== (t.assignedTo || ''));
    if (newForMe && st === 'open' && !t.declinedAt) msgs.push(`${t.urgent ? '🚨 Urgent task' : 'New task'} from ${t.reassignedByName || t.createdByName}: ${t.title}`);
    else if (st === 'review' && S.isAdmin) msgs.push(`${t.submittedByName || 'Someone'} finished: ${t.title}. Please approve.`);
    else if (st === 'open' && t.declinedAt && isMine(t)) msgs.push(`Redo: ${t.title} (${t.declinedByName})`);
    else if (st === 'done' && t.submittedBy === S.user.uid) msgs.push(`Approved ✓ ${t.title}`);
  }
  try { localStorage.setItem('taskSeen', JSON.stringify(now)); } catch {}
  if (!msgs.length) return;
  if (first && msgs.length > 1) { toast(`${msgs.length} task updates since you last opened`); notify('ANP Accounts', `${msgs.length} task updates`); return; }
  msgs.slice(0, 3).forEach((m, i) => setTimeout(() => { toast(m); notify('ANP Accounts', m); }, i * 2600));
}
/* ---- lock-screen alerts: each phone saves its push token; the sender (Cloudflare Worker) delivers ---- */
const PUSH_URL = (window.GHAR_CONFIG && window.GHAR_CONFIG.pushUrl) || '';
async function setupPush(force) {
  const done = st => { S.pushState = st; S.pushOn = st === 'on'; if (S.view === 'more') render(); };
  try {

      return done(/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone ? 'Open the app from its Home Screen icon (not Safari) for lock-screen alerts.' : 'This phone/browser does not support lock-screen alerts.');
    if (Notification.permission !== 'granted') return done('');
    S.pushState = 'checking';
    const reg = await navigator.serviceWorker.ready, token = await api.pushToken(reg);
    if (!token) return done('This phone/browser does not support lock-screen alerts.');
    const have = S.me?.pushTokens || [];
    if (!have.includes(token) || force) await api.updateUser(S.user.uid, {pushTokens: [...have.filter(t => t !== token).slice(-3), token]});
    done('on');
  } catch (e) { console.warn('push setup', e); done('Problem: ' + String(e?.message || e)); }
}

async function pushTo(to, title, body, tag, go) {

/* ================= dashboard (notebook style) ================= */
function presetRange(p) {
  const t = today();
  switch (p) {
    case 'today': return [t, t];
    case 'yday': { const y = addDays(t, -1); return [y, y]; }
    case '7d': return [addDays(t, -6), t];
    case 'month': return [monthStart(t), t];
    case 'lmonth': { const s = monthStart(t, 1); return [s, monthEnd(s)]; }
  }
  return [S.dash.from, S.dash.to];
}
async function rangeEntries() {
  const {from, to} = S.dash;
  if (from >= S.since) return S.entries.filter(e => e.date >= from && e.date <= to);
  const key = from + '|' + to;
  if (S.rangeCache?.key === key) return S.rangeCache.list;
  const list = (await api.fetchRange(from, to)).filter(e => !e.book || BOOKS[e.book]);
  const m = new Map(list.map(e => [e.id, e]));
  S.entries.forEach(e => { if (e.date >= from && e.date <= to) m.set(e.id, e); });
  S.rangeCache = {key, list: [...m.values()]};
  return S.rangeCache.list;
}
async function renderDash() {
  const d = S.dash, main = $('#main');

  let html = `<div class="stats">

      html += `<table class="dt nb"><thead><tr><th>Date</th><th class="num">Wash</th><th class="num">Iron</th><th class="num">Others</th><th class="num">Total</th><th>Return</th></tr></thead><tbody>
        ${es.map(e => { const g = ironCounts(e), r = returnState(e); return `<tr data-open="${e.id}"><td>${shortDate(e.date)}</td><td class="num">${g.wash || '–'}</td><td class="num">${g.iron || '–'}</td><td class="num">${ironOthers(e) ? money(ironOthers(e)) : '–'}</td><td class="num"><b>${g.wash + g.iron}</b><div class="sub-amt">${money(total(e))}</div></td><td>${r.txt ? `<span class="badge ${r.cls}" style="margin:0">${r.txt}</span>` : ''}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td>Total</td><td class="num">${c.w}</td><td class="num">${c.i}</td><td class="num">${money(es.reduce((t, e) => t + ironOthers(e), 0))}</td><td class="num">${c.w + c.i}<div class="sub-amt strong">${money(bt)}</div></td><td></td></tr></tfoot></table>`;
    } else {

        ${es.flatMap(e => (e.items || []).map((i, n) => `<tr data-open="${e.id}"><td>${n ? '' : shortDate(e.date)}</td><td><span data-nt>${esc(i.name)}</span>${n === 0 && isPending(e) ? ' <span class="badge b-credit" style="margin:0">to pay</span>' : ''}</td><td class="num">${+i.qty || 0} ${esc(i.unit || '')}</td><td class="num">${money(i.amount)}</td></tr>`)).join('')}

  $('#dashBody').innerHTML = html;

/* ================= Excel export ================= */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('Excel library did not load')); document.head.appendChild(s); });
}
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    try { await navigator.share({files: [file], title: name}); return; } catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function reportRows() {

  for (const k of BOOK_KEYS) {

      ...es.flatMap(e => (e.items || []).map((i, n) => [e.date, personName(e.person || '') || '', i.other ? 'Others: ' + (i.note || '') + (!num(i.wash) && !num(i.iron) && num(i.rate) ? ` (${num(i.qty)} × ${num(i.rate)})` : '') : i.name, num(i.wash), num(i.iron), num(i.washRate), num(i.ironRate), num(i.amount),
        n ? '' : total(e), n ? '' : num(e.retWash), n ? '' : num(e.retIron), n ? '' : (e.retOn || ''), n ? '' : statusText(e), n ? '' : (e.status === 'paid' ? e.mode : e.paidMode || ''), n ? '' : (e.ref || e.paidRef || ''), n ? '' : (e.createdByName || '')]))];
    else sheets[BOOKS[k].name] = [['Date', 'Item', 'Qty', 'Unit', 'Price', 'Entry total', 'Status', 'Paid by', 'Paid on', 'UTR', 'Added by', 'Notes'],
      ...es.flatMap(e => (e.items || []).map((i, n) => [e.date, i.name, num(i.qty), i.unit, num(i.amount), n ? '' : total(e), n ? '' : statusText(e),

async function exportExcel() {
  if (S.view !== 'dash') return;
  const sheets = reportRows(), name = `anp-accounts_${S.dash.from}_to_${S.dash.to}`;
  try {
    const X = await loadXLSX(), wb = X.utils.book_new();

      ws['!cols'] = title === 'Summary' ? [{wch: 22}, {wch: 24}, {wch: 14}, {wch: 14}] : rows[0].map((_, ci) => ({wch: Math.min(40, Math.max(9, ...rows.map(r => String(r[ci] ?? '').length + 2)))}));
      const range = X.utils.decode_range(ws['!ref']), head = title === 'Summary' ? rows[3] : rows[0];
      for (let R = 1; R <= range.e.r; R++) for (let C = 0; C <= range.e.c; C++) { const cell = ws[X.utils.encode_cell({r: R, c: C})]; if (cell && cell.t === 'n' && /Amount|total|Total|Paid|To pay|rate|Rate/.test(String(head[C] || ''))) cell.z = '"₹"#,##0.00'; }
      if (title !== 'Summary') ws['!autofilter'] = {ref: ws['!ref']};
      X.utils.book_append_sheet(wb, ws, title);
    }
    const out = X.write(wb, {bookType: 'xlsx', type: 'array'});
    await shareOrDownload(new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name + '.xlsx');
  } catch (err) {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = Object.entries(sheets).filter(([t]) => t !== 'Summary').flatMap(([t, r]) => [[t], ...r, []]);
    await shareOrDownload(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type: 'text/csv'}), name + '.csv');
    toast('Excel library unavailable. Saved as CSV instead');
  }
}

/* ================= events ================= */
async function mainClick(ev) {
  const t = ev.target;
  const bk = t.closest('[data-book]'); if (bk) { if (bk.dataset.book === 'iron') S.ironPerson = null; S.book = bk.dataset.book; S.view = 'book'; S.filter = 'all'; S.q = ''; $('#search').value = ''; render(); return scrollTo(0, 0); }
  const o = t.closest('[data-open]'); if (o) return openDetail(o.dataset.open);
  const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; return render(); }
  const g = t.closest('[data-goto]'); if (g) { S.view = g.dataset.goto; S.q = ''; $('#search').value = ''; render(); return scrollTo(0, 0); }
  if (t.closest('[data-rates]')) return openRateCard();
  if (t.closest('[data-ratelist]')) return openRateList(S.book);
  const ip = t.closest('[data-iperson]'); if (ip) { S.ironPerson = ip.dataset.iperson; render(); return scrollTo(0, 0); }
  if (t.closest('[data-iadd]')) { const n = prompt(tx('Name (e.g. Mrugraj)')); if (!n || !n.trim()) return; return saveIronPeople([...ironPeople(), {id: api.newId().slice(0, 10), name: n.trim()}]); }
  if (t.closest('[data-imanage]')) return openIronPeople();
  const ie = t.closest('[data-iedit]'); if (ie) return openIronPerson(ie.dataset.iedit);
  if (t.closest('[data-bulkpay]')) return openBulkPay();
  const sm = t.closest('[data-salm]'); if (sm) { const [y, mo] = (S.salMonth || today().slice(0, 7)).split('-').map(Number), d = new Date(y, mo - 1 + +sm.dataset.salm, 1); S.salMonth = ds(d).slice(0, 7); return render(); }
  const at = t.closest('[data-att]'); if (at) { const x = findEmp(at.dataset.att); if (!x) return; x.att = {...(x.att || {})};
    if (x.att[at.dataset.day] === at.dataset.v) delete x.att[at.dataset.day]; else x.att[at.dataset.day] = at.dataset.v; saveEmp(x);
    const v = x.att[at.dataset.day]; tellAdmins(`🗓 ${x.name}: ${v === 'F' ? 'Full day' : v === 'H' ? 'Half day' : v === 'A' ? 'Absent' : 'cleared'} · ${shortDate(at.dataset.day)}`, `Marked by ${who()}`, 'att-' + x.id + at.dataset.day, 'salary&emp=' + x.id); return render(); }
  const em = t.closest('[data-emp]'); if (em) return openEmp(em.dataset.emp);
  const li = t.closest('[data-list]'); if (li) return openList(li.dataset.list);
  const db = t.closest('[data-dbook]'); if (db) { S.dash.book = db.dataset.dbook; return renderDash(); }
  const p = t.closest('[data-preset]');
  if (p) { S.dash.preset = p.dataset.preset; if (p.dataset.preset !== 'custom') [S.dash.from, S.dash.to] = presetRange(p.dataset.preset); return renderDash(); }
  const us = t.closest('[data-ustat]'); if (us) return setUserStatus(us.dataset.uid, us.dataset.ustat, us.dataset.asrole);
  const ur = t.closest('[data-urole]'); if (ur) return setUserRole(ur.dataset.uid, ur.dataset.urole);
  if (t.closest('#signOutBtn')) return api.signOut();
  const pr = t.closest('[data-pyren]'); if (pr) { const l = payees(), x = l[+pr.dataset.pyren]; const n = prompt(tx('Name (optional)'), x.pn || ''); if (n == null) return; x.pn = n.trim(); await savePayees(l); return render(); }
  const pd = t.closest('[data-pydel]'); if (pd) { const l = payees(); if (!confirm('Delete this?')) return; const [x] = l.splice(+pd.dataset.pydel, 1);
    if (S.isAdmin && S.settings?.upi) { const u = Object.fromEntries(Object.entries(S.settings.upi).filter(([, v]) => v.pa !== x.pa)); try { await api.saveSettings({upi: u}); S.settings.upi = u; } catch {} }
    try { Object.keys(localStorage).filter(k => k.startsWith('upi_') && (JSON.parse(localStorage.getItem(k) || '{}').pa === x.pa)).forEach(k => localStorage.removeItem(k)); } catch {}
    await savePayees(l); return render(); }
  if (t.closest('[data-pyscan]')) return openQrScanner(async tq => { const p = parseUpi(tq); if (!p) return toast('Not a UPI QR'); await addPayee(p); toast('UPI saved: ' + (p.pn || p.pa)); render(); });
  if (t.closest('[data-pyadd]')) { const pa = prompt(tx('UPI ID (e.g. shop@okaxis)'), ''); if (!pa || !pa.includes('@')) return; const pn = prompt(tx('Name (optional)'), '') || ''; await addPayee({pa: pa.trim(), pn: pn.trim()}); return render(); }
  if (t.closest('#pushRetry')) { S.pushState = 'checking'; render(); return setupPush(true); }
  if (t.closest('#pushTest')) return testPush();
  if (t.closest('#notifBtn')) { try { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Alerts on' : 'Alerts not allowed'); if (r === 'granted') await setupPush(true); } catch {} return render(); }
  if (t.closest('#renameBtn')) { const n = prompt('Your name', S.me.name); if (n && n.trim()) api.updateUser(S.user.uid, {name: n.trim()}).then(() => toast('Name updated')).catch(e => toast(errText(e))); return; }
  const td = t.closest('[data-tday]'); if (td) { const n = +td.dataset.tday; S.taskDay = n === 0 ? today() : addDays(S.taskDay, n); return render(); }
  const tl = t.closest('[data-tlang]'); if (tl) { try { localStorage.setItem('tLang', tl.dataset.tlang); } catch {} return render(); }
  if (t.closest('[data-newtask]')) return openTaskForm();
  const ss = t.closest('[data-sstart],[data-sunstart],[data-sdone]');
  if (ss) { const id = ss.dataset.sstart || ss.dataset.sunstart || ss.dataset.sdone, x = findTask(id); if (!x) return;
    if (ss.dataset.sdone) return openSubmit(id);
    const patch = ss.dataset.sstart ? {status: 'working', startedAt: Date.now(), startedByName: S.me.name, ...(x.assignedTo ? {} : {assignedTo: S.user.uid, assignedName: S.me.name})} : {status: 'open', startedAt: null};
    api.saveTask({...strip(x), ...patch, updatedBy: S.user.uid, updatedAt: Date.now()}).catch(e => toast(errText(e)));
    if (ss.dataset.sstart) tellAdmins(`▶ ${who()} started a task`, x.title, 'task-' + x.id, 'tasks'); return toast(ss.dataset.sstart ? 'Started' : 'OK'); }
  const tr = t.closest('[data-task]'); if (tr) return openTask(tr.dataset.task);
}
function mainChange(ev) {
  const k = ev.target.dataset.df; if (!k) return;
  S.dash[k] = ev.target.value;
  if (S.dash.from > S.dash.to) [S.dash.from, S.dash.to] = [S.dash.to, S.dash.from];
  renderDash();
}
$('#sheet').addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-close]')) return closeSheet();
  const eb = t.closest('[data-empback]'); if (eb) return openEmp(eb.dataset.empback);
  const lb = t.closest('[data-listback]'); if (lb) return openList(lb.dataset.listback);
  const back = t.closest('[data-back]'); if (back) return openDetail(back.dataset.back);
  const bt = t.closest('[data-back-task]'); if (bt) { Rec.cancel(); return openTask(bt.dataset.backTask); }
  const ed = t.closest('[data-edit]'); if (ed) return openForm(findEntry(ed.dataset.edit));
  const mp = t.closest('[data-markpaid]'); if (mp) return openMarkPaid(mp.dataset.markpaid);
  const rt = t.closest('[data-return]'); if (rt) return setReturned(rt.dataset.return, null);
  const ir = t.closest('[data-iret]'); if (ir) return setReturned(ir.dataset.iret, +ir.dataset.idx);
  const up = t.closest('[data-unpay]');
  if (up) { const e = findEntry(up.dataset.unpay); const u = {...strip(e), paidOn: null, paidMode: null, paidRef: null, paidByName: null, updatedAt: Date.now(), updatedByName: S.me.name};
    api.saveEntry(u).catch(err => toast(errText(err))); Object.assign(e, u); tellAdmins(`↩ ${who()} undid a payment · ${BOOKS[bookOf(e)].name}`, `${money(total(e))} · ${itemsText(e)}`, 'e-' + e.id); return openDetail(e.id); }
  const dl = t.closest('[data-delete]');
  if (dl && confirm('Delete this entry for everyone?')) {
    const id = dl.dataset.delete, e = findEntry(id);
    api.deleteEntry(id).catch(err => toast(errText(err)));
    if (e) photoIdsOf(e).forEach(x => api.deletePhoto(x).catch(() => {}));
    if (e) tellAdmins(`🗑 ${who()} deleted ${money(total(e))} · ${BOOKS[bookOf(e)].name}`, `${itemsText(e)} · ${shortDate(e.date)}`, 'e-' + e.id);
    closeSheet(); toast('Deleted');
  }
});

boot();
</script>
